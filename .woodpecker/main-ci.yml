# Single pipeline: tests (rust, webui, sidecars) → sonar → multi-arch push of every
# production image → Discord (same pattern as supertokens-gateway).
#
# Each step writes .ci-status/<key>: "running" first, "success" last. A failing step leaves
# "running", a step that never ran leaves no file. scripts/ci/notify-discord.sh turns that
# into the ✅ / ❌ / ⏭️ flow in the Discord embed.
when:
  - event: [push, manual]
    branch:
      exclude: [main]
  - event: tag
    ref: refs/tags/v*

steps:
  test-orchestrator:
    image: rust:1.97-bookworm
    commands:
      - |
        set -e
        ST="$${PWD}/.ci-status"; mkdir -p "$${ST}"; chmod 777 "$${ST}" 2>/dev/null || true
        echo running > "$${ST}/rust"
        # rdkafka builds librdkafka from source (cmake-build feature).
        apt-get update && apt-get install -y --no-install-recommends cmake zlib1g-dev
        # The rust image ships the minimal profile (no rustfmt/clippy).
        rustup component add rustfmt clippy
        cargo fmt --all -- --check
        cargo test --locked --all-targets
        cargo clippy --all-targets -- -D warnings
        echo success > "$${ST}/rust"

  test-mcp:
    image: rust:1.97-bookworm
    depends_on: [test-orchestrator]
    commands:
      - |
        set -e
        ST="$${PWD}/.ci-status"; mkdir -p "$${ST}"; chmod 777 "$${ST}" 2>/dev/null || true
        echo running > "$${ST}/mcp"
        rustup component add rustfmt clippy
        # mcp/ is a standalone crate, not a workspace member, so the root
        # cargo invocations above do not cover it.
        cd mcp
        cargo fmt --all -- --check
        cargo test --locked --all-targets
        cargo clippy --all-targets -- -D warnings
        echo success > "$${ST}/mcp"

  webui:
    image: node:22-bookworm
    commands:
      - |
        set -e
        ST="$${PWD}/.ci-status"; mkdir -p "$${ST}"; chmod 777 "$${ST}" 2>/dev/null || true
        echo running > "$${ST}/webui"
        cd cdc-native-ui
        npm ci
        npm run openapi:check
        npm run typecheck
        npm run build
        echo success > "$${ST}/webui"

  test-sidecars:
    image: python:3.12-slim-bookworm
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
    commands:
      - |
        set -e
        ST="$${PWD}/.ci-status"; mkdir -p "$${ST}"; chmod 777 "$${ST}" 2>/dev/null || true
        echo running > "$${ST}/sidecars"
        # stdlib unittest only; pgdump imports paramiko lazily (image-only dependency).
        for D in sidecar_common pgcopydb pgdump pgloader redisshake mongocopy rsync; do
          echo "==> docker/$${D}"
          (cd "docker/$${D}" && PYTHONPATH=../sidecar_common python -m unittest discover -p 'test_*.py')
        done
        echo success > "$${ST}/sidecars"

  test-wireguard:
    image: golang:1.26-alpine
    environment:
      CGO_ENABLED: "0"
    commands:
      - |
        set -e
        ST="$${PWD}/.ci-status"; mkdir -p "$${ST}"; chmod 777 "$${ST}" 2>/dev/null || true
        echo running > "$${ST}/wireguard"
        cd docker/wireguard
        go vet ./...
        go test ./...
        echo success > "$${ST}/wireguard"

  test-jdbc-admin:
    image: maven:3.9.9-eclipse-temurin-17
    commands:
      - |
        set -e
        ST="$${PWD}/.ci-status"; mkdir -p "$${ST}"; chmod 777 "$${ST}" 2>/dev/null || true
        echo running > "$${ST}/jdbc-admin"
        # Unit tests run against in-memory H2; no external database needed.
        cd docker/jdbc-admin
        mvn -B -q test
        echo success > "$${ST}/jdbc-admin"

  sonar:
    image: sonarsource/sonar-scanner-cli:11
    depends_on: [test-orchestrator, test-mcp]
    environment:
      SONAR_HOST_URL: https://sonarqube.b-quik-connect.com
      SONAR_TOKEN:
        from_secret: SONAR_TOKEN
    commands:
      - |
        set -e
        # Runs as a non-root user: .ci-status was created (chmod 777) by the rust steps.
        echo running > .ci-status/sonar
        echo "SonarQube at $${SONAR_HOST_URL}"
        sonar-scanner -Dsonar.qualitygate.wait=true
        echo success > .ci-status/sonar

  build-and-push:
    image: docker:27-cli
    depends_on: [sonar, webui, test-sidecars, test-wireguard, test-jdbc-admin]
    environment:
      DOCKERHUB_USERNAME:
        from_secret: DOCKERHUB_USERNAME
      DOCKERHUB_TOKEN:
        from_secret: DOCKERHUB_TOKEN
      REGISTRY_NAMESPACE:
        from_secret: REGISTRY_NAMESPACE
    commands:
      - |
        set -e
        mkdir -p .ci-status
        chmod 777 .ci-status 2>/dev/null || true
        echo running > .ci-status/build

        # Image tag == WebUI login-page version (rule in scripts/ci/version.sh).
        VERSION="$$(sh scripts/ci/version.sh)"
        if [ -n "$${CI_COMMIT_TAG:-}" ]; then RELEASE=1; else RELEASE=0; fi
        echo "$${VERSION}" > .ci-status/version
        CREATED="$$(date -u +"%Y-%m-%dT%H:%M:%SZ")"

        echo "Commit:  $${CI_COMMIT_SHA}"
        echo "VERSION: $${VERSION}  (release=$${RELEASE}; 'latest' only moves on v* tags)"

        echo "$${DOCKERHUB_TOKEN}" | docker login -u "$${DOCKERHUB_USERNAME}" --password-stdin

        docker buildx create --use --name multiarch || docker buildx use multiarch
        docker buildx inspect --bootstrap

        # Image list: scripts/ci/images.txt (shared with the Discord notifier).
        # Each image writes .ci-status/image-<name> (running → success) for the per-image lines.
        # Read on fd 3 so nothing in the loop body can consume the list from stdin.
        : > .ci-status/images.env.tmp
        while IFS= read -r SPEC <&3; do
          case "$${SPEC}" in ''|'#'*) continue ;; esac

          VAR="$$(echo "$${SPEC}" | cut -d'|' -f1)"
          NAME="$$(echo "$${SPEC}" | cut -d'|' -f2)"
          FILE="$$(echo "$${SPEC}" | cut -d'|' -f3)"
          CONTEXT="$$(echo "$${SPEC}" | cut -d'|' -f4)"
          EXTRA="$$(echo "$${SPEC}" | cut -d'|' -f5 | sed "s#{VERSION}#$${VERSION}#g")"
          IMAGE="$${REGISTRY_NAMESPACE}/$${NAME}"
          echo running > ".ci-status/image-$${NAME}"

          echo "==> $${IMAGE}:$${VERSION}  ($${FILE} @ $${CONTEXT})"
          # $${EXTRA} is intentionally unquoted (word-split into flags).
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --pull \
            -f "$${FILE}" \
            -t "$${IMAGE}:$${VERSION}" \
            $${EXTRA} \
            --label "org.opencontainers.image.title=$${NAME}" \
            --label "org.opencontainers.image.version=$${VERSION}" \
            --label "org.opencontainers.image.revision=$${CI_COMMIT_SHA}" \
            --label "org.opencontainers.image.source=$${CI_REPO_URL:-}" \
            --label "org.opencontainers.image.created=$${CREATED}" \
            --provenance=mode=max \
            --sbom=true \
            --cache-from "type=registry,ref=$${IMAGE}:buildcache" \
            --cache-to "type=registry,ref=$${IMAGE}:buildcache,mode=max,image-manifest=true,oci-mediatypes=true,ignore-error=true" \
            --metadata-file ".ci-status/$${NAME}.json" \
            --push \
            "$${CONTEXT}"

          DIGEST="$$(sed -n 's/.*"containerimage.digest": *"\(sha256:[0-9a-f]*\)".*/\1/p' ".ci-status/$${NAME}.json" | head -1)"
          if [ -z "$${DIGEST}" ]; then echo "no digest for $${IMAGE}" >&2; exit 1; fi
          echo "$${VAR}=$${IMAGE}:$${VERSION}@$${DIGEST}" >> .ci-status/images.env.tmp
          echo success > ".ci-status/image-$${NAME}"
        done 3< scripts/ci/images.txt
        echo success > .ci-status/build

        # publish = release manifest + 'latest'. 'latest' moves only after every image built,
        # so it never points at a half-released set.
        echo running > .ci-status/publish
        mv .ci-status/images.env.tmp .ci-status/images.env
        cat .ci-status/images.env
        if [ "$${RELEASE}" = "1" ]; then
          while IFS='=' read -r VAR REF; do
            IMAGE="$${REF%%:*}"
            echo "==> $${IMAGE}:latest -> $${VERSION}"
            docker buildx imagetools create -t "$${IMAGE}:latest" "$${IMAGE}@$${REF##*@}"
          done < .ci-status/images.env
        fi
        echo success > .ci-status/publish

  notify-discord:
    image: curlimages/curl:8.7.1
    depends_on: [test-orchestrator, test-mcp, webui, test-sidecars, test-wireguard, test-jdbc-admin, sonar, build-and-push]
    when:
      status: [success, failure]
    environment:
      DISCORD_WEBHOOK:
        from_secret: DISCORD_WEBHOOK
      REGISTRY_NAMESPACE:
        from_secret: REGISTRY_NAMESPACE
    commands:
      - sh scripts/ci/notify-discord.sh
