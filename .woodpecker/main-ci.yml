# Single pipeline: rust + webui → sonar → multi-arch image push → Discord.
when:
  - event: [push, manual]
    branch:
      exclude: [main]
  - event: tag
    tag: v*

steps:
  test-orchestrator:
    image: rust:1.97-bookworm
    commands:
      # rdkafka builds librdkafka from source (cmake-build feature).
      - apt-get update && apt-get install -y --no-install-recommends cmake zlib1g-dev
      - cargo fmt --all -- --check
      - cargo test --locked --all-targets
      - cargo clippy --all-targets -- -D warnings

  test-mcp:
    image: rust:1.97-bookworm
    depends_on: [test-orchestrator]
    commands:
      # mcp/ is a standalone crate, not a workspace member, so the root
      # cargo invocations above do not cover it.
      - cd mcp
      - cargo fmt --all -- --check
      - cargo test --locked --all-targets
      - cargo clippy --all-targets -- -D warnings

  webui:
    image: node:22-bookworm
    commands:
      - cd cdc-native-ui
      - npm ci
      - npm run openapi:check
      - npm run typecheck
      - npm run build

  sonar:
    image: sonarsource/sonar-scanner-cli:11
    depends_on: [test-orchestrator, test-mcp]
    environment:
      SONAR_HOST_URL: https://sonarqube.b-quik-connect.com
      SONAR_TOKEN:
        from_secret: SONAR_TOKEN
    commands:
      - |
        set -e
        echo "SonarQube at $${SONAR_HOST_URL}"
        sonar-scanner -Dsonar.qualitygate.wait=true

  build-and-push:
    image: docker:27-cli
    depends_on: [sonar, webui]
    environment:
      DOCKERHUB_USERNAME:
        from_secret: DOCKERHUB_USERNAME
      DOCKERHUB_TOKEN:
        from_secret: DOCKERHUB_TOKEN
      REGISTRY_NAMESPACE:
        from_secret: REGISTRY_NAMESPACE
    commands:
      - |
        set -e
        mkdir -p .ci-status
        chmod a+rwx .ci-status || true
        echo running > .ci-status/build
        echo running > .ci-status/publish

        SHORT_SHA="$$(echo "$${CI_COMMIT_SHA}" | cut -c1-7)"
        BRANCH="$${CI_COMMIT_BRANCH:-}"
        BRANCH_SLUG="$$(echo "$${BRANCH}" | tr '[:upper:]' '[:lower:]' | sed 's#[^a-z0-9_.-]#-#g' | sed 's#-\\{2,\\}#-#g' | sed 's#^-##; s#-$##')"
        if [ -n "$${CI_COMMIT_TAG:-}" ]; then
          VERSION="$${CI_COMMIT_TAG}"
        elif [ "$${BRANCH}" = "main" ] || [ -z "$${BRANCH_SLUG}" ]; then
          VERSION="sha-$${SHORT_SHA}"
        else
          VERSION="$${BRANCH_SLUG}-$${SHORT_SHA}"
        fi

        echo "Commit: $${CI_COMMIT_SHA}"
        echo "Short: $${SHORT_SHA}"
        echo "VERSION=$${VERSION}"

        echo "$${DOCKERHUB_TOKEN}" | docker login -u "$${DOCKERHUB_USERNAME}" --password-stdin

        docker buildx create --use --name multiarch || docker buildx use multiarch
        docker buildx inspect --bootstrap

        # name|dockerfile|build context
        # Orchestrator and Connect both build from the repo root: docker/Dockerfile
        # copies Cargo sources; docker/connect/Dockerfile compiles kafka-connect-jdbc/.
        for SPEC in \
          "cdc-orchestrator|docker/Dockerfile|." \
          "cdc-connect|docker/connect/Dockerfile|." \
          "cdc-webui|cdc-native-ui/Dockerfile|cdc-native-ui" \
          "cdc-mcp|mcp/Dockerfile|mcp" ; do

          NAME="$${SPEC%%|*}"
          REST="$${SPEC#*|}"
          FILE="$${REST%%|*}"
          CONTEXT="$${REST#*|}"
          IMAGE_NAME="$${REGISTRY_NAMESPACE}/$${NAME}"

          echo "==> $${IMAGE_NAME}:$${VERSION}  ($${FILE} @ $${CONTEXT})"
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            -f "$${FILE}" \
            -t "$${IMAGE_NAME}:latest" \
            -t "$${IMAGE_NAME}:$${VERSION}" \
            --push \
            "$${CONTEXT}"
        done

        echo success > .ci-status/build
        echo success > .ci-status/publish

  notify-discord:
    image: curlimages/curl:8.7.1
    depends_on: [build-and-push]
    when:
      status: [success]
    environment:
      DISCORD_WEBHOOK:
        from_secret: DISCORD_WEBHOOK
      REGISTRY_NAMESPACE:
        from_secret: REGISTRY_NAMESPACE
    commands:
      - |
        set -e
        SHORT_SHA="$$(echo "$${CI_COMMIT_SHA}" | cut -c1-7)"
        BRANCH="$${CI_COMMIT_BRANCH:-}"
        BRANCH_SLUG="$$(echo "$${BRANCH}" | tr '[:upper:]' '[:lower:]' | sed 's#[^a-z0-9_.-]#-#g' | sed 's#-\\{2,\\}#-#g' | sed 's#^-##; s#-$##')"
        if [ -n "$${CI_COMMIT_TAG:-}" ]; then
          VERSION="$${CI_COMMIT_TAG}"
        elif [ "$${BRANCH}" = "main" ] || [ -z "$${BRANCH_SLUG}" ]; then
          VERSION="sha-$${SHORT_SHA}"
        else
          VERSION="$${BRANCH_SLUG}-$${SHORT_SHA}"
        fi
        REF="$${CI_COMMIT_TAG:-$${BRANCH_SLUG:-unknown}}"
        BUILD_NO="$${CI_PIPELINE_NUMBER:-n/a}"
        RUN_URL="$${CI_PIPELINE_URL:-$${CI_BUILD_LINK}}"
        COMMIT_URL="$${CI_COMMIT_LINK:-$${CI_REPO_LINK}/commit/$${CI_COMMIT_SHA}}"
        TS="$$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
        WORKFLOW="$${CI_WORKFLOW_NAME:-main-ci}"
        NS="$${REGISTRY_NAMESPACE}"

        cat > payload.json <<EOF
        {
          "embeds": [
            {
              "title": "🚀 cdc-orchestrator images pushed",
              "description": "Docker multi-arch publish completed.",
              "color": 5763719,
              "fields": [
                { "name": "Project", "value": "$${CI_REPO_NAME}", "inline": true },
                { "name": "Branch", "value": "$${REF}", "inline": true },
                { "name": "Triggered by", "value": "$${CI_COMMIT_AUTHOR}", "inline": true },
                { "name": "Images", "value": "\`$${NS}/cdc-orchestrator\`\n\`$${NS}/cdc-connect\`\n\`$${NS}/cdc-webui\`\n\`$${NS}/cdc-mcp\`", "inline": false },
                { "name": "Tags", "value": "\`latest\`, \`$${VERSION}\`", "inline": true },
                { "name": "Platforms", "value": "\`linux/amd64\`, \`linux/arm64\`", "inline": true },
                { "name": "Commit", "value": "[\`$${SHORT_SHA}\`]($${COMMIT_URL})", "inline": true },
                { "name": "Pipeline", "value": "[#$${BUILD_NO}]($${RUN_URL}) · \`$${WORKFLOW}\`", "inline": true }
              ],
              "footer": { "text": "Woodpecker CI" },
              "timestamp": "$${TS}"
            }
          ]
        }
        EOF

        # One POST only; -f fails the step if Discord returns an error.
        curl -sSf -X POST "$${DISCORD_WEBHOOK}" \
          -H "Content-Type: application/json" \
          --data-binary @payload.json
