        schema: { type: string }
        schema_type: { type: string, enum: [avro, json, protobuf], default: avro }
        compatibility: { type: string }
    PagedGroupsResponse:
      type: object
      required: [items, total, page, page_size, timestamp]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ConsumerGroupItem"
        total: { type: integer, minimum: 0 }
        page: { type: integer, minimum: 1 }
        page_size: { type: integer, minimum: 1, maximum: 200 }
        timestamp: { type: string, format: date-time }
    GroupLagItem:
      type: object
      required: [topic, partition, current_offset, log_end_offset, lag]
      properties:
        topic: { type: string }
        partition: { type: integer }
        current_offset: { type: integer, format: int64 }
        log_end_offset: { type: integer, format: int64 }
        lag: { type: integer, format: int64 }
    GroupLagResponse:
      type: object
      required: [group, total_lag, entries, timestamp]
      properties:
        group: { type: string }
        total_lag: { type: integer, format: int64 }
        entries:
          type: array
          items:
            $ref: "#/components/schemas/GroupLagItem"
        timestamp: { type: string, format: date-time }
    SourceConfig:
      type: object
      required: [source_type, connection, schema_mode, schemas, tables]
      properties:
        source_type:
          type: string
          enum: [postgres, mysql, mariadb, sqlserver, oracle]
        connection:
          type: object
          additionalProperties:
            type: string
        schema_mode:
          type: string
          enum: [all_schemas, specific_schemas]
        table_mode:
          type: string
          enum: [all_tables, specific_tables]
          default: all_tables
        schemas:
          type: array
          items: { type: string }
        tables:
          type: array
          items: { type: string }
        capture_mode:
          type: string
          enum: [logical, trigger, sync_once, incremental]
          default: logical
          description: "logical = ongoing WAL CDC; trigger = table triggers when WAL is unavailable; sync_once = copy current rows once then stop; incremental = JDBC poll on a timestamp/id watermark (no WAL, no triggers; hard deletes are not captured)"
        changelog_retention_hours:
          type: integer
          minimum: 0
          description: "Trigger capture only. Prune source changelog rows older than this many hours. Omit or 0 disables pruning. Choose a window larger than expected replication lag so unconsumed rows are not dropped."
        timestamp_column:
          type: string
          description: "Incremental capture. Timestamp/watermark column such as updated_at. Combined with incrementing_column this uses JDBC timestamp+incrementing mode."
        incrementing_column:
          type: string
          description: "Incremental capture. Strictly incrementing column, usually the primary key (e.g. id). Required for replica upsert. Append-only tables can use this without a timestamp column."
        upsert_key_columns:
          type: array
          items: { type: string }
          description: "Incremental replica upsert key on the target (text/composite allowed), e.g. [BRANCH_NO, PRO_CODE]."
        table_poll:
          type: array
          items: { $ref: "#/components/schemas/TablePollRule" }
          description: |
            Incremental capture: per-table poll strategy overrides. Tables without a rule poll
            on timestamp_column / incrementing_column (watermark). Each rolling_window /
            full_copy table runs its own query-mode, mode=bulk JDBC source connector
            (`{connector}-poll-{schema-table}`; the first one takes the pipeline connector
            name when no table uses a watermark) and publishes to the same topic as table mode.
        start_position:
          $ref: "#/components/schemas/StartPosition"
    StartPosition:
      type: object
      required: [mode]
      description: |
        Where a log-based (`capture_mode=logical`) source starts on its first Start (ADR 0014).
        One-shot: used while the source connector has no stored offset, or when the value
        changes (offsets are reset and re-seeded). Afterwards the stored offset wins, so a
        restart never rewinds. Use `POST /cdc/profiles/{id}/reposition` to move a running
        pipeline. Non-default values are rejected (400) on trigger / incremental / sync_once
        pipelines, and `resync` is rejected on them (they never copy rows).
      properties:
        mode:
          type: string
          enum: [snapshot_then_stream, latest, earliest_retained, custom]
          default: snapshot_then_stream
          description: |
            snapshot_then_stream = copy every row, then stream (Debezium snapshot.mode=initial).
            latest = no row copy, stream from now (snapshot.mode=no_data).
            earliest_retained = no row copy, stream from the oldest change the source still
            serves. PostgreSQL: the replication slot's confirmed_flush_lsn (400 when the slot
            does not exist — a new slot starts at now). SQL Server: oldest LSN in the CDC
            tables. Oracle: oldest archived/online redo SCN. MySQL: not supported yet (400).
            custom = no row copy, stream from `position`, checked against what the source
            still holds (400 when it is older than retained logs or ahead of the source).
        position:
          $ref: "#/components/schemas/LogPosition"
    LogPosition:
      type: object
      required: [kind]
      description: A change-log position; `kind` must match the source type.
      properties:
        kind:
          type: string
          enum: [postgres_lsn, mysql_binlog, sql_server_lsn, oracle_scn]
        lsn:
          type: string
          description: "postgres_lsn: X/Y hex as pg_current_wal_lsn() prints it, or decimal."
          example: 0/1A2B3C4D
        file:
          type: string
          description: "mysql_binlog: binlog file name."
          example: mysql-bin.000042
        pos:
          type: integer
          minimum: 4
          description: "mysql_binlog: byte position in the file (4 = first event)."
        gtid_set:
          type: string
          description: "mysql_binlog (optional): executed GTID set; must include gtid_purged."
        commit_lsn:
          type: string
          description: "sql_server_lsn: 0000002a:00000c10:0003 or 0x0000002A00000C100003."
        scn:
          type: string
          description: "oracle_scn: decimal SCN."
    RepositionRequest:
      type: object
      required: [start_position]
      properties:
        start_position:
          $ref: "#/components/schemas/StartPosition"
        clear_target:
          type: boolean
          default: false
          description: Truncate the mapped target tables (PostgreSQL targets) before the source resumes.
    TablePollRule:
      type: object
      required: [table, strategy]
      properties:
        table:
          type: string
          description: "SCHEMA.TABLE, one of source.tables."
        strategy:
          type: string
          enum: [watermark, rolling_window, full_copy]
          description: |
            watermark = JDBC offset on the watermark columns (default).
            rolling_window = every poll re-reads rows whose window_column is today or within
            the previous window_days days; no offset is kept, so date-only or non-unique
            timestamps cannot skip same-day changes. Rows older than the window reach the
            target only through an initial load.
            full_copy = every poll re-reads the whole table (small tables only).
        window_column:
          type: string
          description: "rolling_window only: date/timestamp column, e.g. UPDATE_DATE."
        window_days:
          type: integer
          minimum: 0
          maximum: 31
          default: 1
          description: "rolling_window only: previous days included besides today (1 = today + yesterday)."
    RecordDiffRequest:
      type: object
      required: [table]
      properties:
        table: { type: string, description: "Source table SCHEMA.TABLE (one of the pipeline's tables)." }
        key_columns:
          type: array
          items: { type: string }
          description: "Source key column(s). Empty = mapping pk_columns, else source PK, else target PK."
        compare_columns:
          type: array
          items: { type: string }
          description: Source columns whose values are compared for rows on both sides.
        compare_all_columns:
          type: boolean
          default: false
          description: Compare every mapped, untransformed non-key column.
        options:
          type: object
          properties:
            trim_trailing_spaces: { type: boolean, default: true }
            case_insensitive: { type: boolean, default: false }
            recheck: { type: boolean, default: true }
            recheck_limit: { type: integer, default: 10000, description: Candidates rechecked per kind; the rest are `unverified`. }
    RecordDiffJob:
      type: object
      properties:
        id: { type: string, format: uuid }
        profile_id: { type: string, format: uuid }
        profile_name: { type: string }
        table: { type: string }
        state: { type: string, enum: [queued, running, succeeded, failed, cancelled] }
        phase: { type: string, enum: [queued, planning, scanning, comparing, rechecking, done] }
        actor: { type: string }
        created_at: { type: string, format: date-time }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
        error: { type: string }
        options: { type: object }
        requested_key_columns: { type: array, items: { type: string } }
        requested_compare_columns: { type: array, items: { type: string } }
        compare_all_columns: { type: boolean }
        plan:
          type: object
          properties:
            source_schema: { type: string }
            source_table: { type: string }
            target_schema: { type: string }
            target_table: { type: string }
            key_source: { type: string, enum: [request, mapping, source_pk, target_pk] }
            source_key_columns: { type: array, items: { type: string } }
            target_key_columns: { type: array, items: { type: string } }
            source_compare_columns: { type: array, items: { type: string } }
            target_compare_columns: { type: array, items: { type: string } }
            warnings: { type: array, items: { type: string } }
        counts:
          type: object
          properties:
            source_rows: { type: integer }
            target_rows: { type: integer }
            matched: { type: integer }
            source_only: { type: integer }
            target_only: { type: integer }
            mismatched: { type: integer }
            source_duplicate_keys: { type: integer }
            target_duplicate_keys: { type: integer }
            source_null_keys: { type: integer }
            target_null_keys: { type: integer }
            resolved_in_flight: { type: integer }
            unverified: { type: integer }
        progress:
          type: object
          properties:
            source_rows_read: { type: integer }
            target_rows_read: { type: integer }
            source_rows_estimate: { type: integer }
            target_rows_estimate: { type: integer }
            buckets_done: { type: integer }
            buckets_total: { type: integer }
            recheck_done: { type: integer }
            recheck_total: { type: integer }
    RecordDiffRowsPage:
      type: object
      properties:
        kind: { type: string, enum: [source_only, target_only, mismatched] }
        offset: { type: integer }
        limit: { type: integer }
        total: { type: integer }
        rows:
          type: array
          description: "{ key: {col: value}, status: confirmed|unverified, values?: {...}, differences?: [{column, target_column, source, target}] }"
          items: { type: object }
    InitialLoadRequest:
      type: object
      properties:
        clear_target:
          type: boolean
          default: false
          description: Truncate each target table just before copying into it.
        tables:
          type: array
          items: { type: string }
          description: "Subset of source.tables (SCHEMA.TABLE) to load. Empty = every selected table."
    InitialLoadTable:
      type: object
      properties:
        source: { type: string }
        target: { type: string }
        state:
          type: string
          enum: [pending, running, done, failed, skipped]
        rows_copied: { type: integer }
        error: { type: string }
    InitialLoadStatus:
      type: object
      properties:
        profile_id: { type: string, format: uuid }
        state:
          type: string
          enum: [running, succeeded, failed, cancelled]
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
        clear_target: { type: boolean }
        actor: { type: string }
        error: { type: string }
        rows_copied: { type: integer }
        tables:
          type: array
          items: { $ref: "#/components/schemas/InitialLoadTable" }
    TargetConfig:
      type: object
      required: [target_type, connection]
      properties:
        name:
          type: string
          description: User-defined name for this destination
        target_type:
          type: string
          enum: [postgres, mysql, mariadb, sqlserver, oracle]
        connection:
          type: object
          additionalProperties:
            type: string
    LakeDestination:
      type: object
      required: [table_format, zone, change_mode, catalog_type, connection]
      properties:
        name: { type: string }
        table_format:
          type: string
          enum: [iceberg, parquet, delta]
          default: iceberg
        zone:
          type: string
          enum: [bronze, silver, gold]
          default: bronze
          description: CDC lands bronze or silver. Gold is derived, not captured.
        change_mode:
          type: string
          enum: [changelog, upsert, scd2]
          default: changelog
        catalog_type:
          type: string
          enum: [jdbc, rest, hadoop, glue, nessie]
          default: jdbc
        namespace: { type: string }
        warehouse:
          type: string
          description: Warehouse URI such as s3://lake/warehouse
        connection:
          type: object
          additionalProperties:
            type: string
          description: S3-compatible endpoint, bucket, keys, and catalog_uri
    GovernanceConfig:
      type: object
      properties:
        domain:
          type: string
          description: Industry-agnostic bounded context (commerce, clinical, grid)
        dataset: { type: string }
        sensitivity:
          type: string
          enum: [public, internal, confidential, restricted]
          default: internal
        industry_pack:
          type: string
          nullable: true
          description: Optional overlay (retail, banking, healthcare, …)
        pii_fields:
          type: array
          items: { type: string }
    ColumnMapping:
      type: object
      required: [source, target]
      properties:
        source: { type: string }
        target: { type: string }
        data_type:
          type: string
          description: Shared SQL type; source and target column types must match
    TableMapping:
      type: object
      required: [source_schema, source_table, target_schema, target_table]
      properties:
        source_schema: { type: string }
        source_table: { type: string }
        target_schema: { type: string }
        target_table: { type: string }
        identical:
          type: boolean
          default: false
          description: When true, source and target table/column names match and no remap is applied
        columns:
          type: array
          items:
            $ref: "#/components/schemas/ColumnMapping"
    ProfileUpsertRequest:
      type: object
      required: [name, source, flow]
      properties:
        name: { type: string, minLength: 1 }
        description: { type: string }
        tags:
          type: array
          maxItems: 20
          items: { type: string, maxLength: 40 }
          description: >-
            Free-form labels for grouping and filtering pipelines (e.g. crm, master-data).
            Trimmed and de-duplicated case-insensitively on save. Omit on update to keep the
            saved tags; send [] to clear them. Duplicate copies the original's tags. Returned
            on every profile as `tags`.
        pattern:
          type: string
          enum: [source_to_stream, source_to_target, source_to_lake, source_to_olake]
          description: >-
            source_to_target is database replica (current product).
            source_to_stream is Event-first (Kafka topics).
            source_to_lake is Event-first plus Iceberg from Kafka.
            source_to_olake is Analytics-first (OLake; draft only until Phase 3).
        stream_platform:
          type: string
          enum: [kafka, redpanda]
          nullable: true
        transform_strategy:
          type: string
          enum: [none, predefined, custom]
        source:
          $ref: "#/components/schemas/SourceConfig"
        target:
          type: object
          allOf:
            - $ref: "#/components/schemas/TargetConfig"
          nullable: true
        lake:
          type: object
          allOf:
            - $ref: "#/components/schemas/LakeDestination"
          nullable: true
        governance:
          $ref: "#/components/schemas/GovernanceConfig"
        sink_error_policy:
          type: string
          enum: [fail_fast, dlq]
          default: fail_fast
          description: >-
            Source-to-target sink record handling. fail_fast stops logical and
            incremental sinks on rejected records. dlq continues and writes
            rejected records with error-context headers. Trigger sinks retain
            their existing DLQ behavior for backward compatibility.
        flow:
          type: object
          required: [transforms, schedule]
          properties:
            transforms:
              type: array
              items:
                type: object
                additionalProperties: true
            schedule:
              type: object
              required: [delivery_mode]
              properties:
                delivery_mode:
                  type: string
                  enum: [realtime, micro_batch]
                interval_seconds:
                  type: integer
                  minimum: 1
                  nullable: true
            mappings:
              type: array
              items:
                $ref: "#/components/schemas/TableMapping"
    ScheduleEntry:
      type: object
      required: [profile_id, name, tags, status, enabled, pattern, capture_mode, delivery_mode, kind]
      properties:
        profile_id: { type: string, format: uuid }
        name: { type: string }
        tags:
          type: array
          items: { type: string }
        status: { type: string }
        enabled: { type: boolean }
        pattern: { type: string }
        capture_mode: { type: string, enum: [logical, trigger, sync_once, incremental] }
        delivery_mode: { type: string, enum: [realtime, micro_batch] }
        kind:
          type: string
          enum: [poll, stream, once, idle]
          description: >-
            poll = interval-driven JDBC poll (incremental / trigger); stream = continuous
            log capture; once = one-time snapshot; idle = not running, nothing scheduled.
        interval_ms:
          type: integer
          nullable: true
          description: Poll interval the connector runs on. Present for poll pipelines even while idle.
        interval_source:
          type: string
          nullable: true
          enum: [micro_batch, default]
        last_tick_at: { type: string, format: date-time, nullable: true }
        next_tick_at:
          type: string
          format: date-time
          nullable: true
          description: last_tick_at + interval_ms. Aligned to the connector interval, not its exact poll instant.
        full_refresh_minutes: { type: integer, nullable: true }
        last_full_refresh_at: { type: string, format: date-time, nullable: true }
        next_full_refresh_at:
          type: string
          format: date-time
          nullable: true
          description: Equal to the response timestamp when a running pipeline has never refreshed (next sweep runs it).
        next_run_at:
          type: string
          format: date-time
          nullable: true
          description: Soonest of next_tick_at and next_full_refresh_at.
        source_offsets:
          type: string
          nullable: true
          description: Last source offsets the poll audit read from Kafka Connect.
    ScheduleResponse:
      type: object
      required: [timestamp, poll_audit_check_secs, refresh_sweep_secs, entries]
      properties:
        timestamp: { type: string, format: date-time }
        poll_audit_check_secs: { type: integer }
        refresh_sweep_secs: { type: integer }
        entries:
          type: array
          items:
            $ref: "#/components/schemas/ScheduleEntry"
    ProfileResponse:
      type: object
      required: [profile, timestamp]
      properties:
        profile:
          type: object
          additionalProperties: true
        timestamp: { type: string, format: date-time }
    ProfilesResponse:
      type: object
      required: [profiles, timestamp]
      properties:
        profiles:
          type: array
          items:
            type: object
            additionalProperties: true
        timestamp: { type: string, format: date-time }
    ProfileDlqStatus:
      type: object
      required:
        [profile_id, configured_policy, effective_policy, enabled, exists, messages_count, high_watermark, timestamp]
      properties:
        profile_id: { type: string, format: uuid }
        configured_policy:
          type: string
          enum: [fail_fast, dlq]
        effective_policy:
          type: string
          enum: [fail_fast, dlq]
        enabled: { type: boolean }
        topic: { type: string, nullable: true }
        exists: { type: boolean }
        messages_count: { type: integer, format: int64 }
        high_watermark: { type: integer, format: int64 }
        size_bytes: { type: integer, format: int64, nullable: true }
        timestamp: { type: string, format: date-time }
    ValidationResponse:
      type: object
      required: [valid, message, timestamp]
      properties:
        valid: { type: boolean }
        message: { type: string }
        timestamp: { type: string, format: date-time }
    SourceCatalogResponse:
      type: object
      required: [reachable, message, schemas, tables, timestamp]
      properties:
        reachable: { type: boolean }
        message: { type: string }
        schemas:
          type: array
          items:
            type: object
            required: [name, table_count, captured]
            properties:
              name: { type: string }
              table_count: { type: integer }
              captured: { type: boolean }
        tables:
          type: array
          items:
            type: object
            required: [schema, name, captured]
            properties:
              schema: { type: string }
              name: { type: string }
              captured: { type: boolean }
              row_count: { type: integer, nullable: true }
              primary_key:
                type: array
                items: { type: string }
        timestamp: { type: string, format: date-time }
    SourceTableInspectRequest:
      type: object
      required: [source, schema, name]
      properties:
        source:
          $ref: "#/components/schemas/SourceConfig"
        schema: { type: string }
        name: { type: string }
        limit: { type: integer, minimum: 1, maximum: 100, default: 50 }
    TriggerInstallRequest:
      type: object
      required: [source]
      properties:
        source:
          $ref: "#/components/schemas/SourceConfig"
        tables:
          type: array
          items: { type: string }
          description: Qualified schema.table names. Defaults to source.tables.
    TriggerInstallResponse:
      type: object
      required: [installed, already_present, change_log, message, timestamp]
      properties:
        installed:
          type: array
          items: { type: string }
        already_present:
          type: array
          items: { type: string }
        change_log: { type: string }
        sql: { type: string }
        executed: { type: boolean }
        message: { type: string }
        timestamp: { type: string, format: date-time }
    TriggerPreviewResponse:
      type: object
      required: [tables, change_log, sql, will_execute, vendor, message, timestamp]
      properties:
        tables:
          type: array
          items: { type: string }
        change_log: { type: string }
        sql: { type: string }
        will_execute: { type: boolean }
        vendor: { type: string }
        message: { type: string }
        timestamp: { type: string, format: date-time }
    TriggerStatusResponse:
      type: object
      required: [change_log_present, tables, timestamp]
      properties:
        change_log_present: { type: boolean }
        tables:
          type: array
          items:
            type: object
            required: [schema, name, installed]
            properties:
              schema: { type: string }
              name: { type: string }
              installed: { type: boolean }
        timestamp: { type: string, format: date-time }
    TargetTableInspectRequest:
      type: object
      required: [target, schema, name]
      properties:
        target:
          $ref: "#/components/schemas/TargetConfig"
        schema: { type: string }
        name: { type: string }
        limit: { type: integer, minimum: 1, maximum: 100, default: 50 }
    TableIndex:
      type: object
      required: [name, unique, columns]
      properties:
        name: { type: string }
        unique: { type: boolean }
        columns:
          type: array
          description: Key columns in index order (INCLUDE columns excluded). Expression indexes may carry expression text or be empty.
          items: { type: string }
        descending:
          type: array
          items: { type: string }
        filter: { type: string, nullable: true, description: Partial-index predicate }
        expression: { type: boolean, description: Index has expression keys (omitted when false) }
    TargetDdlRequest:
      type: object
      required: [target, statements]
      properties:
        target: { $ref: "#/components/schemas/TargetConfig" }
        statements:
          type: array
          maxItems: 500
          description: >-
            Creation DDL only (CREATE SCHEMA/TABLE/INDEX, optionally behind a SQL Server IF guard
            or inside an Oracle BEGIN EXECUTE IMMEDIATE … END; block). DROP/ALTER/TRUNCATE/DML are rejected.
          items: { type: string }
        profile_id:
          type: string
          format: uuid
          nullable: true
          description: Merge the saved profile's target credentials (masked password in the wizard)
    TargetDdlResponse:
      type: object
      required: [status, executed, results]
      properties:
        status: { type: boolean, description: All statements succeeded }
        executed: { type: integer }
        results:
          type: array
          items:
            type: object
            required: [index, ok]
            properties:
              index: { type: integer }
              ok: { type: boolean }
              error: { type: string }
    SourceTableInspectResponse:
      type: object
      required: [schema, name, primary_key, columns, rows, limit, timestamp]
      properties:
        schema: { type: string }
        name: { type: string }
        row_count: { type: integer, nullable: true }
        primary_key:
          type: array
          items: { type: string }
        columns:
          type: array
          items:
            type: object
            required: [name, data_type, nullable, position, primary_key, unique]
            properties:
              name: { type: string }
              data_type: { type: string }
              nullable: { type: boolean }
              position: { type: integer }
              primary_key: { type: boolean }
              pk_position: { type: integer, nullable: true }
              unique: { type: boolean, description: "Column is the primary key or the only column of a unique index" }
              size: { type: integer, nullable: true, description: "Character length or numeric precision (jdbc-admin COLUMN_SIZE)" }
              scale: { type: integer, nullable: true, description: "Numeric scale (jdbc-admin DECIMAL_DIGITS)" }
              default_value: { type: string, nullable: true, description: "Source default expression, verbatim" }
              auto_increment: { type: boolean, description: "Identity / serial / AUTO_INCREMENT column (omitted when false)" }
        indexes:
          type: array
          description: Indexes and unique constraints, the primary-key index included. Absent when the inspector does not report them (older cdc-jdbc-admin).
          items:
            $ref: "#/components/schemas/TableIndex"
        rows:
          type: array
          items:
            type: object
            additionalProperties: true
        limit: { type: integer }
        timestamp: { type: string, format: date-time }
    ProcessingValidationResponse:
      type: object
      required: [valid, errors]
      properties:
        valid: { type: boolean }
        errors:
          type: array
          items: { type: string }
    ProcessingBatchPolicy:
      type: object
      required: [max_records, max_bytes, max_wait_ms]
      properties:
        max_records: { type: integer, minimum: 1, maximum: 10000, default: 500 }
        max_bytes:
          type: integer
          minimum: 1
          maximum: 67108864
          default: 4194304
        max_wait_ms: { type: integer, minimum: 1, default: 25 }
    ProcessingRetryPolicy:
      type: object
      required: [max_attempts, initial_backoff_ms, max_backoff_ms]
      properties:
        max_attempts: { type: integer, minimum: 1, default: 3 }
        initial_backoff_ms: { type: integer, minimum: 1, default: 100 }
        max_backoff_ms: { type: integer, minimum: 1, default: 5000 }
    DataServiceEnrichment:
      type: object
      required:
        - base_url
        - datasource
        - mapper
        - api_key_env
        - lookup_field
        - lookup_parameter
        - result_key_field
      properties:
        base_url: { type: string, format: uri }
        datasource: { type: string }
        mapper: { type: string }
        api_key_env: { type: string }
        lookup_field: { type: string }
        lookup_parameter: { type: string, default: list }
        result_key_field: { type: string }
        output_field: { type: string, nullable: true }
        static_parameters:
          type: object
          additionalProperties: true
    ProcessingStage:
      type: object
      required:
        - id
        - name
        - kind
        - execution
        - timeout_ms
        - retry
        - failure_policy
        - enabled
      properties:
        id: { type: string, minLength: 1 }
        name: { type: string, minLength: 1 }
        kind:
          type: string
          enum: [transform, filter, enrich]
        execution:
          type: string
          enum: [grpc]
        endpoint: { type: string, format: uri, nullable: true }
        dataservice:
          type: object
          allOf:
            - $ref: "#/components/schemas/DataServiceEnrichment"
          nullable: true
        timeout_ms: { type: integer, minimum: 1, default: 10000 }
        retry:
          $ref: "#/components/schemas/ProcessingRetryPolicy"
        failure_policy:
          type: string
          enum: [fail_pipeline, emit_unchanged, drop, dead_letter]
        enabled: { type: boolean, default: true }
        attributes:
          type: object
          additionalProperties:
            type: string
    ProcessingPipeline:
      type: object
      required:
        - id
        - name
        - input_topic
        - output_topic
        - dead_letter_topic
        - consumer_group
        - batch
        - stages
        - preserve_partition_order
        - enabled
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1 }
        input_topic: { type: string, minLength: 1 }
        output_topic: { type: string, minLength: 1 }
        dead_letter_topic: { type: string, minLength: 1 }
        consumer_group: { type: string, minLength: 1 }
        batch:
          $ref: "#/components/schemas/ProcessingBatchPolicy"
        stages:
          type: array
          items:
            $ref: "#/components/schemas/ProcessingStage"
        preserve_partition_order: { type: boolean, default: true }
        enabled: { type: boolean, default: false }
    AlertRule:
      type: object
      required: [id, name, conditionType, connectorFilter, channels, enabled]
      properties:
        id: { type: string }
        name: { type: string }
        conditionValue:
          type: object
          additionalProperties: true
          nullable: true
        conditionType:
          type: string
          enum: [connector_failed, connector_paused, connector_recovered, connector_failed_for, connector_state_changed, dlq_growth, pipeline_failed, latency_above]
          description: "`connector_paused_N_min` (legacy) is read as connector_paused. connector_failed_for uses conditionValue.minutes; latency_above uses conditionValue {seconds, forMinutes}."
        connectorFilter: { type: string, description: Glob over the connector, DLQ topic or pipeline name (by condition) }
        channels:
          type: array
          items: { type: string }
          description: Legacy (pre-ADR-0015); ignored when channelIds is set
        channelIds:
          type: array
          items: { type: string }
        cooldownMinutes: { type: integer, minimum: 0, default: 0 }
        webhookUrl: { type: string, format: uri, nullable: true, description: Legacy; moved to a channel at startup }
        webhookSecret: { type: string, nullable: true, writeOnly: true, description: "Legacy; returned as ********" }
        enabled: { type: boolean }
        createdAt: { type: string, format: date-time, nullable: true }
    PipelineLatencyCurrent:
      type: object
      properties:
        profile_id: { type: string, format: uuid }
        name: { type: string }
        ts: { type: string, format: date-time }
        e2e_ms: { type: integer, nullable: true, description: End-to-end latency (ms) }
        capture_ms: { type: integer, nullable: true }
        sink_ms: { type: integer, nullable: true, description: "0 when the backlog is younger than the Connect offset-flush interval" }
        lag_records: { type: integer, nullable: true }
        throughput_rps: { type: number, nullable: true }
        last_event_at: { type: string, format: date-time, nullable: true }
        method: { type: string, enum: [heartbeat, trigger_inbox, estimate] }
        status: { type: string, enum: [ok, behind, idle, stopped, unknown] }
        note: { type: string, nullable: true }
        e2e_p95_1h_ms: { type: integer, nullable: true }
        probe_enabled: { type: boolean }
        probe_error: { type: string, nullable: true }
    NotificationChannel:
      type: object
      required: [name, type]
      description: ADR 0015. Each type reads only its own settings and secrets.
      properties:
        id: { type: string }
        name: { type: string }
        type: { type: string, enum: [webhook, email, line, slack, discord, teams] }
        enabled: { type: boolean, default: true }
        settings:
          type: object
          properties:
            url: { type: string, format: uri, description: webhook }
            legacySecretHeader: { type: boolean, description: "webhook: send X-Webhook-Secret instead of X-CDC-Signature" }
            smtpHost: { type: string }
            smtpPort: { type: integer, description: "default 587 (starttls), 465 (tls), 25 (none)" }
            smtpSecurity: { type: string, enum: [starttls, tls, none] }
            smtpUsername: { type: string }
            from: { type: string }
            to: { type: array, items: { type: string } }
            lineTo: { type: string, description: "LINE user/group/room id (U|C|R + 32 hex)" }
        secrets:
          type: object
          writeOnly: false
          description: >-
            webhook: signingSecret · email: smtpPassword · line: channelAccessToken ·
            slack/discord/teams: webhookUrl. Responses show ******** for stored values.
          additionalProperties: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        migratedFromRule: { type: string, nullable: true }
    NotificationDelivery:
      type: object
      properties:
        delivery_id: { type: string }
        timestamp: { type: string, format: date-time }
        channel_id: { type: string, nullable: true }
        channel_name: { type: string }
        channel_type: { type: string }
        rule_id: { type: string, nullable: true }
        rule_name: { type: string, nullable: true }
        condition: { type: string }
        subject: { type: string }
        outcome: { type: string, enum: [delivered, failed, dropped] }
        attempts: { type: integer }
        status_code: { type: integer, nullable: true }
        error: { type: string, nullable: true }
        duration_ms: { type: integer }
        test: { type: boolean }
    SchemaCompareConn:
      type: object
      required: [type]
      properties:
        type: { type: string, example: postgres }
        host: { type: string }
        port: { type: string }
        database: { type: string }
        username: { type: string }
        password: { type: string, writeOnly: true }
        schema: { type: string, description: "Optional schema filter (blank = all)" }
    SchemaCompareProfileRequest:
      type: object
      required: [name, source, target]
      properties:
        name: { type: string }
        source: { $ref: "#/components/schemas/SchemaCompareConn" }
        target: { $ref: "#/components/schemas/SchemaCompareConn" }
    SchemaCompareProfile:
      allOf:
        - $ref: "#/components/schemas/SchemaCompareProfileRequest"
        - type: object
          properties:
            id: { type: string, format: uuid }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }
    ExecDdlRequest:
      type: object
      required: [target, statement]
      properties:
        target: { $ref: "#/components/schemas/SchemaCompareConn" }
        statement: { type: string, example: "CREATE SCHEMA IF NOT EXISTS analytics" }
    CopyDataRequest:
      type: object
      required: [source, target, tables]
      properties:
        source: { $ref: "#/components/schemas/SchemaCompareConn" }
        target: { $ref: "#/components/schemas/SchemaCompareConn" }
        tables:
          type: array
          items:
            type: object
            required: [schema, name]
            properties:
              schema: { type: string }
              name: { type: string }
        batch_size: { type: integer }
        truncate_before_copy: { type: boolean, default: false }
        force_direct_copy: { type: boolean, default: false }
        max_rows: { type: integer, nullable: true }
    CopyDataResponse:
      type: object
      properties:
        total_rows_copied: { type: integer }
        errors: { type: integer }
        tables:
          type: array
          items:
            type: object
            properties:
              schema: { type: string }
              name: { type: string }
              rows_copied: { type: integer }
              status: { type: string }
              error: { type: string }
    TableCountRequest:
      type: object
      required: [connection, schema, table]
      properties:
        connection: { $ref: "#/components/schemas/SchemaCompareConn" }
        schema: { type: string }
        table: { type: string }
    TableCountResponse:
      type: object
      properties:
        schema: { type: string }
        table: { type: string }
        count: { type: integer }
    TablePreviewRequest:
      type: object
      required: [connection, schema, table]
      properties:
        connection: { $ref: "#/components/schemas/SchemaCompareConn" }
        schema: { type: string }
        table: { type: string }
        page: { type: integer, default: 0 }
        page_size: { type: integer }
        search: { type: string, nullable: true }
    TablePreviewResponse:
      type: object
      properties:
        columns: { type: array, items: { type: string } }
        rows: { type: array, items: { type: array, items: {} } }
        page: { type: integer }
        page_size: { type: integer }
        has_more: { type: boolean }
    SchemaCountsRequest:
      type: object
      required: [connection, schema]
      properties:
        connection: { $ref: "#/components/schemas/SchemaCompareConn" }
        schema: { type: string }
    SchemaCountsResponse:
      type: object
      properties:
        schema: { type: string }
        estimated: { type: boolean }
        counts: { type: object, additionalProperties: { type: integer } }
    AuditEvent:
      type: object
      properties:
        audit_id: { type: string, format: uuid }
        action: { type: string, example: profile.delete }
        actor: { type: string }
        outcome: { type: string, example: success }
        profile_id: { type: string, format: uuid, nullable: true }
        profile_name: { type: string, nullable: true }
        detail: { type: string, description: JSON-encoded detail }
        timestamp: { type: string, format: date-time }
    AuditEventsResponse:
      type: object
      properties:
        count: { type: integer }
        items:
          type: array
          items: { $ref: "#/components/schemas/AuditEvent" }
    MigrationToolsDiscovery:
      type: object
      properties:
        contract_version: { type: string }
        timestamp: { type: string, format: date-time }
        tools:
          type: array
          items:
            type: object
            properties:
              id: { type: string, enum: [pgcopy, pgloader, redisshake, mongocopy, pgdump, rsync] }
              title: { type: string }
              enabled: { type: boolean }
              contract_path: { type: string }
              discover_path: { type: string }
              ui_path: { type: string }
              orchestrator_env: { type: array, items: { type: string } }
