  /cdc/notifications/channels:
    get:
      summary: List notification channels (secrets redacted as ********)
      description: ADR 0015. `secretsAvailable` is false when ORCH_SECRET_KEY is unset.
      operationId: listNotificationChannels
      tags: [Notifications]
      responses:
        "200":
          description: Channels
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      allOf:
                        - $ref: "#/components/schemas/NotificationChannel"
                        - type: object
                          properties:
                            target: { type: string, description: Secret-free destination label }
                  secretsAvailable: { type: boolean }
                  timestamp: { type: string, format: date-time }
    post:
      summary: Create notification channel
      operationId: createNotificationChannel
      tags: [Notifications]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationChannel"
      responses:
        "200":
          description: Created (secrets redacted)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationChannel"
        "400":
          description: Invalid settings, missing required secret, or ORCH_SECRET_KEY unset
        "409":
          description: A channel with this id exists
  /cdc/notifications/channels/test:
    post:
      summary: Send a sample message through a draft channel (not saved)
      description: >-
        One attempt, no retry. With the id of a saved channel, `********` uses the stored
        secret (refused if the SMTP host/username or a legacy-header webhook host changed).
      operationId: testDraftNotificationChannel
      tags: [Notifications]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationChannel"
      responses:
        "200":
          description: Delivery result (outcome delivered or failed)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationDelivery"
  /cdc/notifications/channels/{id}:
    get:
      summary: Get notification channel (secrets redacted)
      operationId: getNotificationChannel
      tags: [Notifications]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        "200":
          description: Channel
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationChannel"
        "404":
          description: Not found
    put:
      summary: Update notification channel
      description: Secret fields — `********` or omitted keeps the stored value, empty string clears it.
      operationId: updateNotificationChannel
      tags: [Notifications]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationChannel"
      responses:
        "200":
          description: Updated (secrets redacted)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationChannel"
    delete:
      summary: Delete notification channel
      operationId: deleteNotificationChannel
      tags: [Notifications]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        "200":
          description: Deleted
        "409":
          description: Still used by one or more rules
  /cdc/notifications/channels/{id}/test:
    post:
      summary: Send a sample message through a saved channel
      operationId: testNotificationChannel
      tags: [Notifications]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        "200":
          description: Delivery result
