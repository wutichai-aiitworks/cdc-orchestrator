openapi: 3.0.3
info:
  title: Hyper CDC Orchestrator API
  version: 0.2.0
  license:
    name: Proprietary
  description: |
    Unified CDC control-plane API for Debezium engine lifecycle, Kafka Connect,
    governed pipelines (replica, stream, and lakehouse landing), logs, notifications,
    and metrics. Canonical prefix: `/cdc/*`.
    See docs/architecture/hyper-cdc-orchestrator-design.html (Ch.12) for the datalake contract.
servers:
  - url: http://localhost:9788
    description: Direct orchestrator API
tags:
  - name: System
    description: Health and runtime capability discovery.
  - name: Engine
    description: Managed Docker engine lifecycle and status.
  - name: Connectors
    description: Kafka Connect CRUD, validation, actions, tasks, and history.
  - name: Kafka
    description: Topic, broker, consumer-group, schema, ACL, ksqlDB, and lag observability.
  - name: Profiles
    description: Persisted CDC profiles and reconciliation workflows.
  - name: Processing
    description: Kafka-native transform, filter, and enrichment pipeline definitions.
  - name: Logs
    description: Runtime logs, streams, and Connect logger levels.
  - name: Notifications
    description: Alert rules, history, WebSocket events, and webhooks.
  - name: Observability
    description: Prometheus metrics and operational signals.
  - name: Compare
    description: Schema Compare — saved connection pairs, counts, previews, DDL apply, one-shot copy.
  - name: Audit
    description: Sync audit trail and pipeline logs (rqlite-backed).
  - name: Migration Tools
    description: One-shot migration jobs (pgcopydb, pgloader, redis-shake, mongo copy) with a shared contract.
security:
  - bearerAuth: []
paths:
  /health:
    get:
      summary: Liveness endpoint
      operationId: health
      tags: [System]
      security: []
      responses:
        "200":
          description: Service health
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /cdc/capability:
    get:
      summary: Feature capability flags for UI/MCP
      operationId: capability
      tags: [System]
      responses:
        "200":
          description: Capability document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapabilityResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /cdc/engine/status:
    get:
      summary: List container engine service states
      operationId: engineStatus
      tags: [Engine]
      responses:
        "200":
          description: Engine status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EngineStatusResponse"
  /cdc/engine/up:
    post:
      summary: Start managed containers
      operationId: engineUp
      tags: [Engine]
      responses:
        "200":
          description: Engine action response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionResponse"
  /cdc/engine/down:
    post:
      summary: Stop managed containers
      operationId: engineDown
      tags: [Engine]
      responses:
        "200":
          description: Engine action response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionResponse"
  /cdc/engine/restart:
    post:
      summary: Restart managed containers
      operationId: engineRestart
      tags: [Engine]
      responses:
        "200":
          description: Engine action response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionResponse"
  /cdc/cluster:
    get:
      summary: Kafka Connect cluster root metadata
      operationId: clusterInfo
      tags: [Connectors]
      responses:
        "200":
          description: Connect cluster info
  /cdc/connectors:
    get:
      summary: List connectors (expanded status)
      operationId: listConnectors
      tags: [Connectors]
      responses:
        "200":
          description: Connectors map
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectorsResponse"
    post:
      summary: Create connector
      operationId: createConnector
      tags: [Connectors]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConnectorCreateRequest"
      responses:
        "200":
          description: Action response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionResponse"
  /cdc/connectors/templates:
    get:
      summary: Built-in connector config templates for UI quick start
      operationId: connectorTemplates
      tags: [Connectors]
      responses:
        "200":
          description: Connector templates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectorTemplatesResponse"
  /cdc/connectors/validate:
    post:
      summary: Validate connector config (local checks + Connect plugin validate best-effort)
      operationId: validateConnector
      tags: [Connectors]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConnectorValidateRequest"
      responses:
        "200":
          description: Connector validation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectorValidateResponse"
  /cdc/connectors/probe:
    post:
      summary: Test database connectivity from a connector name or config
      operationId: probeConnector
      tags: [Connectors]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConnectorInspectRequest"
      responses:
        "200":
          description: Connectivity probe result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectorProbeResponse"
  /cdc/connectors/catalog:
    post:
      summary: Browse schemas and tables for a source or sink connector
      operationId: catalogConnector
      tags: [Connectors]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConnectorInspectRequest"
      responses:
        "200":
          description: Schema and table catalog
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectorCatalogResponse"
  /cdc/connectors/{name}/status:
    get:
      summary: Get connector status
      operationId: connectorStatus
      tags: [Connectors]
      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Connector status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectorStatusResponse"
  /cdc/connectors/{name}/timeline:
    get:
      summary: Recent connector state history from watcher transitions
      operationId: connectorTimeline
      tags: [Connectors]
      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
        - in: query
          name: limit
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: Connector timeline entries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectorTimelineResponse"
  /cdc/connectors/{name}/config:
    get:
      summary: Get connector config
      operationId: getConnectorConfig
      tags: [Connectors]
      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Connector config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectorConfigResponse"
    put:
      summary: Replace connector config
      operationId: updateConnectorConfig
      tags: [Connectors]
      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConnectorUpdateRequest"
      responses:
        "200":
          description: Action response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionResponse"
  /cdc/connectors/{name}/tasks/{task}/restart:
    post:
      summary: Restart a specific connector task
      operationId: restartConnectorTask
      tags: [Connectors]
      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
        - in: path
          name: task
          required: true
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: Action response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionResponse"
  /cdc/connectors/{name}/{action}:
    post:
      summary: pause | resume | restart connector
      operationId: connectorAction
      tags: [Connectors]
      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
        - in: path
          name: action
          required: true
          schema:
            type: string
            enum: [pause, resume, restart]
      responses:
        "200":
          description: Action response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionResponse"
  /cdc/connectors/{name}:
    delete:
      summary: Delete connector
      operationId: deleteConnector
      tags: [Connectors]
      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Action response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionResponse"
  /cdc/kafka/topics:
    get:
      summary: List Redpanda/Kafka topics
      operationId: kafkaTopics
      tags: [Kafka]
      responses:
        "200":
          description: Topics
  /cdc/topics:
    get:
      summary: List topics with pagination, search, sort, and Kafka metadata
      operationId: listTopics
      tags: [Kafka]
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: page_size
          schema:
            type: integer
            default: 50
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: hide_internal
          schema:
            type: boolean
        - in: query
          name: summary
          description: Names and internal flag only (one broker call); partition, size and message fields are omitted. Use for counts.
          schema:
            type: boolean
            default: false
        - in: query
          name: sort_by
          schema:
            type: string
            enum: [name, partitions, out_of_sync_replicas, replication_factor, messages_count, size]
        - in: query
          name: sort_order
          schema:
            type: string
            enum: [asc, desc]
            default: asc
      responses:
        "200":
          description: Paged topic list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PagedTopicsResponse"
    post:
      summary: Create a Kafka topic
      operationId: createTopic
      tags: [Kafka]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTopicRequest"
      responses:
        "200":
          description: Topic created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionResponse"
  /cdc/topics/{topic}:
    delete:
      summary: Delete a Kafka topic
      operationId: deleteTopic
      tags: [Kafka]
      parameters:
        - in: path
          name: topic
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Topic deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionResponse"
  /cdc/topics/{topic}/recreate:
    post:
      summary: Recreate a Kafka topic with the same partitions, replication, and core configs
      operationId: recreateTopic
      tags: [Kafka]
      parameters:
        - in: path
          name: topic
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Topic recreated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionResponse"
  /cdc/topics/{topic}/clear-messages:
    post:
      summary: Clear all messages from a topic (DELETE cleanup policy only)
      operationId: clearTopicMessages
      tags: [Kafka]
      parameters:
        - in: path
          name: topic
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Messages cleared
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionResponse"
  /cdc/topics/{topic}/messages:
    get:
      summary: Sample messages from a topic (bounded)
      operationId: topicMessages
      tags: [Kafka]
      parameters:
        - in: path
          name: topic
          required: true
          schema:
            type: string
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
        - in: query
          name: offset
          schema:
            type: string
            default: end
        - in: query
          name: partition
          schema:
            type: integer
        - in: query
          name: include_meta
          schema:
            type: boolean
            default: true
        - in: query
          name: mode
          schema:
            type: string
            enum: [latest, earliest]
            default: latest
        - in: query
          name: q
          schema:
            type: string
          description: Filter sampled messages by key or payload substring
      responses:
        "200":
          description: Topic message sample
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TopicMessagesResponse"
    post:
      summary: Produce a message to a topic
      operationId: produceTopicMessage
      tags: [Kafka]
      parameters:
        - in: path
          name: topic
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [value]
              properties:
                value: { type: string }
                key: { type: string }
                partition: { type: integer }
                headers:
                  type: array
                  items:
                    type: object
                    required: [name, value]
                    properties:
                      name: { type: string }
                      value: { type: string }
      responses:
        "200":
          description: Action response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionResponse"
  /cdc/topics/{topic}/copy:
    post:
      summary: Copy topic configuration to a new topic
      operationId: copyTopic
      tags: [Kafka]
      parameters:
        - in: path
          name: topic
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
      responses:
        "200":
          description: Action response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionResponse"
  /cdc/topics/{topic}/configs:
    put:
      summary: Alter topic configs
      operationId: updateTopicConfigs
      tags: [Kafka]
      parameters:
        - in: path
          name: topic
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [configs]
              properties:
                configs:
                  type: object
                  additionalProperties: { type: string }
      responses:
        "200":
          description: Action response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionResponse"
  /cdc/topics/{topic}/metadata:
    get:
      summary: Topic metadata, partition summary, and configs
      operationId: topicMetadata
      tags: [Kafka]
      parameters:
        - in: path
          name: topic
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Topic metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TopicMetadataResponse"
  /cdc/kafka/groups:
    get:
      summary: List consumer groups
      operationId: kafkaGroups
      tags: [Kafka]
      responses:
        "200":
          description: Groups
  /cdc/consumer-groups:
    get:
      summary: List consumer groups with pagination and optional search
      operationId: listConsumerGroups
      tags: [Kafka]
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: page_size
          schema:
            type: integer
            default: 50
        - in: query
          name: search
          schema:
            type: string
      responses:
        "200":
          description: Paged consumer groups
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PagedGroupsResponse"
  /cdc/kafka/groups/{group}/lag:
    get:
      summary: Describe consumer group lag
      operationId: consumerGroupLag
      tags: [Kafka]
      parameters:
        - in: path
          name: group
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Lag details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupLagResponse"
  /cdc/consumer-groups/{group}:
    get:
      summary: Describe a consumer group (state, members, per-partition lag)
      operationId: getConsumerGroup
      tags: [Kafka]
      parameters:
        - in: path
          name: group
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Consumer group details
    delete:
      summary: Delete a consumer group
      operationId: deleteConsumerGroup
      tags: [Kafka]
      parameters:
        - in: path
          name: group
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Action response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionResponse"
  /cdc/consumer-groups/{group}/reset:
    post:
      summary: Reset consumer group offsets (earliest, latest, or timestamp)
      operationId: resetConsumerGroup
      tags: [Kafka]
      parameters:
        - in: path
          name: group
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reset_type]
              properties:
                reset_type: { type: string, enum: [earliest, latest, timestamp] }
                topic: { type: string }
                partitions:
                  type: array
                  items: { type: integer }
                timestamp_ms: { type: integer, format: int64 }
      responses:
        "200":
          description: Action response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionResponse"
  /cdc/brokers:
    get:
      summary: List Kafka/Redpanda brokers
      operationId: listBrokers
      tags: [Kafka]
      responses:
        "200":
          description: Brokers
  /cdc/brokers/{id}:
    get:
      summary: Broker detail with disk usage, log directories, and cluster configs
      operationId: getBroker
      tags: [Kafka]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Broker detail
  /cdc/brokers/{id}/logdirs:
    get:
      summary: Broker log directories (name, error, topics, partitions)
      operationId: getBrokerLogdirs
      tags: [Kafka]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Log directories
  /cdc/brokers/{id}/configs:
    get:
      summary: Broker / cluster configuration entries
      description: |
        Returns Redpanda cluster/node config with Kafka-style aliases.
        `name` is the Redpanda key (underscores) used by PUT.
        `display_name` is the Kafka dotted name shown in Kafbat (for example
        `auto_create_topics_enabled` → `auto.create.topics.enable`).
        Search and PUT accept either form.
      operationId: getBrokerConfigs
      tags: [Kafka]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Config list
    put:
      summary: Update a cluster configuration property
      description: |
        Sets a Redpanda cluster config key. `name` may be the Redpanda underscore
        key (`auto_create_topics_enabled`) or the Kafka dotted alias
        (`auto.create.topics.enable`).
      operationId: updateBrokerConfig
      tags: [Kafka]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                value: { type: string }
                configs:
                  type: object
                  additionalProperties: { type: string }
      responses:
        "200":
          description: Config updated
  /cdc/brokers/{id}/metrics:
    get:
      summary: Broker metrics from Redpanda public_metrics
      operationId: getBrokerMetrics
      tags: [Kafka]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Broker metrics
  /cdc/acls:
    get:
      summary: List Kafka ACLs
      operationId: listAcls
      tags: [Kafka]
      parameters:
        - in: query
          name: search
          schema: { type: string }
        - in: query
          name: host
          schema: { type: string }
        - in: query
          name: resource
          schema: { type: string }
      responses:
        "200":
          description: ACL list
    post:
      summary: Create a Kafka ACL
      operationId: createAcl
      tags: [Kafka]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AclUpsertRequest"
      responses:
        "200":
          description: Action response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionResponse"
    delete:
      summary: Delete a Kafka ACL
      operationId: deleteAcl
      tags: [Kafka]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AclUpsertRequest"
      responses:
        "200":
          description: Action response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionResponse"
  /cdc/schemas:
    get:
      summary: List Schema Registry subjects
      operationId: listSchemas
      tags: [Kafka]
      responses:
        "200":
          description: Schema subjects
    post:
      summary: Publish a schema (Avro, JSON Schema, or Protobuf)
      operationId: createSchema
      tags: [Kafka]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SchemaCreateRequest"
      responses:
        "200":
          description: Action response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionResponse"
  /cdc/schemas/{subject}:
    get:
      summary: Get a schema subject version
      operationId: getSchema
      tags: [Kafka]
      parameters:
        - in: path
          name: subject
          required: true
          schema: { type: string }
        - in: query
          name: version
          schema: { type: string, default: latest }
      responses:
        "200":
          description: Schema detail
    put:
      summary: Add a new schema version
      operationId: updateSchema
      tags: [Kafka]
      parameters:
        - in: path
          name: subject
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Action response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionResponse"
    delete:
      summary: Delete a schema subject
      operationId: deleteSchema
      tags: [Kafka]
      parameters:
        - in: path
          name: subject
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Action response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionResponse"
  /cdc/ksqldb/tables:
    get:
      summary: List ksqlDB tables
      operationId: ksqlTables
      tags: [Kafka]
      responses:
        "200":
          description: ksqlDB tables
  /cdc/ksqldb/streams:
    get:
      summary: List ksqlDB streams
      operationId: ksqlStreams
      tags: [Kafka]
      responses:
        "200":
          description: ksqlDB streams
  /cdc/ksqldb/queries:
    get:
      summary: List ksqlDB persistent queries
      operationId: ksqlQueries
      tags: [Kafka]
      responses:
        "200":
          description: ksqlDB queries
  /cdc/ksqldb/info:
    get:
      summary: ksqlDB server info
      operationId: ksqlInfo
      tags: [Kafka]
      responses:
        "200":
          description: ksqlDB /info payload
  /cdc/ksqldb/query:
    post:
      summary: Execute a ksqlDB statement or query
      operationId: ksqlQuery
      tags: [Kafka]
      requestBody:
        required: true
        content:
          application/json:
            schema:
