  /cdc/profiles/{id}/enable:
    post:
      summary: Enable/disable profile (enable reconciles Connect)
      operationId: setProfileEnabled
      tags: [Profiles]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled:
                  type: boolean
      responses:
        "200":
          description: Profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileResponse"
  /cdc/profiles/{id}/actions/{action}:
    post:
      summary: start | pause | resume | restart | stop | resync (reconciles Kafka Connect)
      description: |
        **Test initial sync** — `start` (or `restart`) with `row_limit` is a connectivity and
        configuration check, not a production sync. It starts the pipeline, copies up to
        `row_limit` rows per table into the target, then stops it: source offsets are reset and
        both connectors are deleted. The profile ends `stopped` with a
        `profile_test_initial_sync` history entry listing per-table row counts. If any step
        fails, the connectors are still removed and the profile ends `failed`. Trigger and
        incremental `source_to_target` pipelines only.

        `resync` with `row_limit` copies a capped sample and keeps the pipeline running.

        `clear_target` is rejected (400) on pipelines with any `rolling_window` table: the
        window only re-reads recent rows, so older rows would stay missing. Use
        `POST /cdc/profiles/{id}/initial-load` to rebuild the target instead. This also
        applies to the scheduled full refresh.
      operationId: profileAction
      tags: [Profiles]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: action
          required: true
          schema:
            type: string
            enum: [start, pause, resume, restart, stop, resync]
        - in: query
          name: row_limit
          schema: { type: integer, minimum: 1 }
          description: With start/restart, runs a test initial sync and stops afterwards. With resync, caps the copied sample.
        - in: query
          name: clear_target
          schema: { type: boolean, default: false }
          description: Truncate the mapped target tables before copying (test initial sync / resync).
      responses:
        "200":
          description: Profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileResponse"
  /cdc/profiles/{id}/reposition:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    post:
      summary: Move a running log-based pipeline to another source position
      description: |
        Halts sink and source, optionally truncates the target, replaces the source
        connector's stored offset with the resolved position and resumes both (ADR 0014).
        `latest` jumps to the source's current position (not MySQL yet); `earliest_retained`
        and `custom` are validated as for `start_position`. Moving forward leaves a gap in
        the target; moving backward replays changes, which the upserting sink absorbs. The
        new value is saved as the profile's `start_position` so a later Start keeps the
        offsets. `snapshot_then_stream` is rejected — use `resync`.
        Audit: `profile.reposition`.
      operationId: repositionProfile
      tags: [Profiles]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RepositionRequest" }
      responses:
        "200":
          description: Repositioned
          content:
            application/json:
              schema:
                type: object
                properties:
                  profile: { type: object, additionalProperties: true }
                  position: { $ref: "#/components/schemas/LogPosition" }
                  timestamp: { type: string, format: date-time }
        "400":
          description: Not log-based capture, no source connector yet, or the position is not available on the source
        "404":
          description: Pipeline not found
        "409":
          description: Another action is running on this pipeline
  /cdc/profiles/{id}/position:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    get:
      summary: Configured start position and the source position last committed
      description: |
        `committed` is parsed from the source connector's Kafka Connect offsets (null before
        the first commit, or for trigger / incremental pipelines). Its shape is a
        `LogPosition`, so it can be pasted into a custom start position or a reposition.
      operationId: getProfilePosition
      tags: [Profiles]
      responses:
        "200":
          description: Position
          content:
            application/json:
              schema:
                type: object
                properties:
                  profile_id: { type: string, format: uuid }
                  connector: { type: string }
                  start_position: { $ref: "#/components/schemas/StartPosition" }
                  committed:
                    nullable: true
                    allOf: [{ $ref: "#/components/schemas/LogPosition" }]
                  timestamp: { type: string, format: date-time }
        "404":
          description: Pipeline not found
  /cdc/profiles/{id}/split:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    post:
      summary: Move some tables into a new Draft pipeline with the same source and target
      description: |
        Creates a copy of the pipeline restricted to the selected tables (their mappings and
        per-table poll rules move with them), saved as a **Draft** — never started. The new
        pipeline gets its own connector/sink names, Kafka topic prefix and replication slot
        (a slot pinned in `source.connection.slot` is dropped from the copy). The selected
        tables are removed from the original's saved configuration; if the original is
        running/paused its connectors keep them until it is restarted
        (`original_restart_required`) — start the new pipeline first, then restart the
        original. Rejected for trigger capture, OLake, pipelines without an explicit table
        list, moving every table, or a name whose connector / topic prefix is already used.
        Audit: `profile.split` on both pipelines.
      operationId: splitProfile
      tags: [Profiles]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, tables]
              properties:
                name: { type: string, description: Name of the new pipeline }
                description: { type: string }
                tables:
                  type: array
                  items: { type: string, description: "schema.table as in source.tables (case-insensitive)" }
      responses:
        "201":
          description: New pipeline created; original updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  original: { type: object, additionalProperties: true, description: Original pipeline after the split (secrets redacted) }
                  created: { type: object, additionalProperties: true, description: New Draft pipeline (secrets redacted) }
                  moved_tables: { type: array, items: { type: string } }
                  original_restart_required: { type: boolean }
        "400":
          description: Invalid split (see `error`; may include `diagnosis`)
        "404":
          description: Pipeline not found
  /cdc/profiles/{id}/duplicate:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    post:
      summary: Copy a pipeline as a new Draft under a new name (original untouched)
      description: |
        Full copy of the pipeline — source and target connections (secrets included), capture
        mode, schedule, every table, mapping and per-table poll rule — saved as a **Draft**,
        never started. The copy gets its own id, connector/sink names and Kafka topic prefix
        derived from the new name; a slot pinned in `source.connection.slot` is dropped. Unlike
        `split`, the original is not modified and any capture mode or pattern is allowed: use
        the copy as a template and edit tables, target and keys before starting it. Rejected
        for an empty name or a name whose connector / topic prefix is already used.
        Audit: `profile.duplicate` on both pipelines.
      operationId: duplicateProfile
      tags: [Profiles]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, description: Name of the new pipeline }
                description: { type: string, description: "Defaults to \"Duplicated from '<original>'.\"" }
      responses:
        "201":
          description: New Draft pipeline created
          content:
            application/json:
              schema:
                type: object
                properties:
                  created: { type: object, additionalProperties: true, description: New Draft pipeline (secrets redacted) }
        "400":
          description: Empty name, or name collides with an existing pipeline / connector / topic prefix
        "404":
          description: Pipeline not found
  /cdc/profiles/{id}/initial-load:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    post:
      summary: Start a background initial load (streaming copy of every source row)
      description: |
        Copies every row of the selected source tables into the PostgreSQL target, in the
        background. Each table is read with **one** forward-only `SELECT *` through
        cdc-jdbc-admin (`/v1/stream`) and inserted in batches with `ON CONFLICT DO NOTHING`,
        so it can run beside a live pipeline (fresher upserts win) and can be re-run after a
        failure. Use it for rows a rolling window never re-reads (e.g. legacy rows with a NULL
        UPDATE_DATE). One load per pipeline at a time; job state lives in memory on the
        orchestrator instance, and the outcome is written to the profile history
        (`profile_initial_load*`) and audit log (`profile.initial_load`).
      operationId: startInitialLoad
      tags: [Profiles]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InitialLoadRequest" }
      responses:
        "202":
          description: Load started
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InitialLoadStatus" }
        "400":
          description: Not a source_to_target pipeline, non-PostgreSQL target, jdbc-admin not configured, unknown table, or a load is already running
    get:
      summary: Progress of the latest initial load
      operationId: getInitialLoad
      tags: [Profiles]
      responses:
        "200":
          description: Load status with per-table row counts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InitialLoadStatus" }
        "404":
          description: No initial load has run for this pipeline on this instance
    delete:
      summary: Cancel a running initial load
      description: Stops between insert batches. Rows already copied are kept.
      operationId: cancelInitialLoad
      tags: [Profiles]
      responses:
        "200":
          description: Current status (state becomes cancelled once the copy stops)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InitialLoadStatus" }
        "404":
          description: No initial load has run for this pipeline on this instance
  /cdc/profiles/{id}/record-diff:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    post:
      summary: Start a record diff of one table (source vs target, by key)
      description: |
        Finds rows that exist only in the source, only in the target, or (when columns are
        compared) in both with different values. Runs in the background (ADR 0013): both
        tables are read once through cdc-jdbc-admin (`/v1/stream`, key + compared columns,
        canonical values), hash-partitioned by key into bucket files on the orchestrator's
        disk, then compared bucket by bucket. Candidates are re-read by key
        (`/v1/lookup`) so rows that converged during the scan are dropped
        (`resolved_in_flight`). Read-only on both databases. One active diff per table;
        `ORCH_RECORD_DIFF_CONCURRENCY` jobs run at once, the rest queue.
        Audit: `profile.record_diff_start`, `profile.record_diff`.
      operationId: startRecordDiff
      tags: [Profiles]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecordDiffRequest" }
      responses:
        "202":
          description: Diff queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecordDiffJob" }
        "400":
          description: Not a source_to_target pipeline, jdbc-admin not configured, or a table outside the pipeline
        "404":
          description: Pipeline not found
        "409":
          description: A diff of this table is already queued or running
    get:
      summary: Record diff jobs of this pipeline, newest first
      operationId: listRecordDiffs
      tags: [Profiles]
      responses:
        "200":
          description: Jobs (the newest 20 finished per pipeline are kept)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RecordDiffJob" }
  /cdc/profiles/{id}/record-diff/{job_id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      - { in: path, name: job_id, required: true, schema: { type: string, format: uuid } }
    get:
      summary: Status, plan, progress and counts of one record diff
      operationId: getRecordDiff
      tags: [Profiles]
      responses:
        "200":
          description: Job
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecordDiffJob" }
        "404":
          description: Not found
    delete:
      summary: Delete a finished record diff and its result files
      operationId: deleteRecordDiff
      tags: [Profiles]
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
        "409":
          description: Still queued or running — cancel it first
  /cdc/profiles/{id}/record-diff/{job_id}/cancel:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      - { in: path, name: job_id, required: true, schema: { type: string, format: uuid } }
    post:
      summary: Cancel a queued or running record diff
      description: Stops between read batches / buckets; work files are removed.
      operationId: cancelRecordDiff
      tags: [Profiles]
      responses:
        "200":
          description: Current status (state becomes cancelled once it stops)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecordDiffJob" }
        "404":
          description: Not found
  /cdc/profiles/{id}/record-diff/{job_id}/rows:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      - { in: path, name: job_id, required: true, schema: { type: string, format: uuid } }
      - in: query
        name: kind
        required: true
        schema: { type: string, enum: [source_only, target_only, mismatched] }
      - { in: query, name: offset, schema: { type: integer, minimum: 0, default: 0 } }
      - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 500, default: 50 } }
    get:
      summary: One page of a succeeded diff's results
      operationId: getRecordDiffRows
      tags: [Profiles]
      responses:
        "200":
          description: Rows
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecordDiffRowsPage" }
        "400":
          description: Unknown kind, or the diff has not succeeded
        "404":
          description: Not found
  /cdc/profiles/{id}/record-diff/{job_id}/download:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      - { in: path, name: job_id, required: true, schema: { type: string, format: uuid } }
      - in: query
        name: kind
        required: true
        schema: { type: string, enum: [source_only, target_only, mismatched] }
      - in: query
        name: format
