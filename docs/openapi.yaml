components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  responses:
    Unauthorized:
      description: Missing or invalid bearer token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    BadRequest:
      description: Invalid request or processing configuration
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Requested resource was not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
    HealthResponse:
      type: object
      required: [service, status, enabled, timestamp]
      properties:
        service: { type: string, example: hyper-cdc-orchestrator }
        status: { type: string, example: ok }
        enabled: { type: boolean }
        timestamp: { type: string, format: date-time }
    CapabilityResponse:
      type: object
      required: [service, version, api_prefix, features, timestamp]
      properties:
        service: { type: string }
        version: { type: string, example: 0.2.0 }
        api_prefix: { type: string, example: /cdc }
        features:
          type: object
          additionalProperties:
            type: boolean
        timestamp: { type: string, format: date-time }
    ServiceStatus:
      type: object
      required: [name, state]
      properties:
        name: { type: string }
        state: { type: string }
        health: { type: string, nullable: true }
    EngineStatusResponse:
      type: object
      required: [engine_target, services, timestamp]
      properties:
        engine_target: { type: string }
        services:
          type: array
          items:
            $ref: "#/components/schemas/ServiceStatus"
        timestamp: { type: string, format: date-time }
    ActionResponse:
      type: object
      required: [action, status, message, audit_id, timestamp]
      properties:
        action: { type: string, example: connect.restart }
        status: { type: string, example: success }
        message: { type: string }
        audit_id: { type: string }
        timestamp: { type: string, format: date-time }
    ConnectorCreateRequest:
      type: object
      required: [name, config]
      properties:
        name: { type: string, minLength: 1 }
        config:
          type: object
          additionalProperties:
            type: string
    ConnectorUpdateRequest:
      type: object
      required: [config]
      properties:
        config:
          type: object
          additionalProperties:
            type: string
    ConnectorValidateRequest:
      type: object
      required: [config]
      properties:
        name: { type: string, nullable: true }
        config:
          type: object
          additionalProperties:
            type: string
    ConnectorValidationIssue:
      type: object
      required: [field, message]
      properties:
        field: { type: string }
        message: { type: string }
    ConnectorValidateResponse:
      type: object
      required: [valid, errors, warnings, timestamp]
      properties:
        valid: { type: boolean }
        normalized_name: { type: string, nullable: true }
        errors:
          type: array
          items:
            $ref: "#/components/schemas/ConnectorValidationIssue"
        warnings:
          type: array
          items: { type: string }
        upstream:
          type: object
          additionalProperties: true
          nullable: true
        timestamp: { type: string, format: date-time }
    ConnectorsResponse:
      type: object
      required: [connectors, timestamp]
      properties:
        connectors:
          type: object
          additionalProperties: true
        timestamp: { type: string, format: date-time }
    ConnectorStatusResponse:
      type: object
      required: [name, status, timestamp]
      properties:
        name: { type: string }
        status:
          type: object
          additionalProperties: true
        timestamp: { type: string, format: date-time }
    ConnectorTemplate:
      type: object
      required: [id, name, description, kind, database_type, config]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        kind: { type: string, enum: [source, sink] }
        database_type: { type: string }
        config:
          type: object
          additionalProperties:
            type: string
    ConnectorInspectRequest:
      type: object
      properties:
        name: { type: string, nullable: true }
        config:
          type: object
          additionalProperties:
            type: string
        schema: { type: string, nullable: true, description: Optional schema filter for catalog }
    ConnectorConnectionPublic:
      type: object
      required: [host, port, database, username]
      properties:
        host: { type: string }
        port: { type: string }
        database: { type: string }
        username: { type: string }
        jdbc_url: { type: string, nullable: true }
    ConnectorProbeResponse:
      type: object
      required: [valid, reachable, kind, database_type, database_label, class_name, connection, configured_schemas, configured_tables, message, timestamp]
      properties:
        valid: { type: boolean }
        reachable: { type: boolean }
        kind: { type: string, enum: [source, sink] }
        database_type: { type: string }
        database_label: { type: string }
        class_name: { type: string }
        connection:
          $ref: "#/components/schemas/ConnectorConnectionPublic"
        configured_schemas:
          type: array
          items: { type: string }
        configured_tables:
          type: array
          items: { type: string }
        message: { type: string }
        timestamp: { type: string, format: date-time }
    ConnectorCatalogSchema:
      type: object
      required: [name, table_count, captured]
      properties:
        name: { type: string }
        table_count: { type: integer }
        captured: { type: boolean }
    ConnectorCatalogTable:
      type: object
      required: [schema, name, captured]
      properties:
        schema: { type: string }
        name: { type: string }
        captured: { type: boolean }
        row_count: { type: integer, nullable: true, description: "Total rows in the table when the live catalog can count them." }
        primary_key:
          type: array
          items: { type: string }
          description: Primary key columns in ordinal order. Empty when the table has no primary key.
    ConnectorCatalogResponse:
      type: object
      required: [kind, database_type, database_label, class_name, connection, reachable, live, message, configured_schemas, configured_tables, schemas, tables, timestamp]
      properties:
        kind: { type: string, enum: [source, sink] }
        database_type: { type: string }
        database_label: { type: string }
        class_name: { type: string }
        connection:
          $ref: "#/components/schemas/ConnectorConnectionPublic"
        reachable: { type: boolean }
        live: { type: boolean }
        message: { type: string }
        configured_schemas:
          type: array
          items: { type: string }
        configured_tables:
          type: array
          items: { type: string }
        schemas:
          type: array
          items:
            $ref: "#/components/schemas/ConnectorCatalogSchema"
        tables:
          type: array
          items:
            $ref: "#/components/schemas/ConnectorCatalogTable"
        timestamp: { type: string, format: date-time }
    ConnectorConfigResponse:
      type: object
      required: [name, config, timestamp]
      properties:
        name: { type: string }
        config:
          type: object
          additionalProperties: true
        timestamp: { type: string, format: date-time }
    ConnectorTemplatesResponse:
      type: object
      required: [templates, timestamp]
      properties:
        templates:
          type: array
          items:
            $ref: "#/components/schemas/ConnectorTemplate"
        timestamp: { type: string, format: date-time }
    TaskErrorBrief:
      type: object
      required: [taskId, trace]
      properties:
        taskId: { type: integer, minimum: 0 }
        trace: { type: string }
    ConnectorTimelineEntry:
      type: object
      required: [ts, connector, to, task_errors]
      properties:
        ts: { type: string, format: date-time }
        connector: { type: string }
        from: { type: string, nullable: true }
        to: { type: string }
        rule: { type: string, nullable: true }
        task_errors:
          type: array
          items:
            $ref: "#/components/schemas/TaskErrorBrief"
        resolved: { type: boolean, nullable: true }
    ConnectorTimelineResponse:
      type: object
      required: [connector, total, items, timestamp]
      properties:
        connector: { type: string }
        total: { type: integer, minimum: 0 }
        items:
          type: array
          items:
            $ref: "#/components/schemas/ConnectorTimelineEntry"
        timestamp: { type: string, format: date-time }
    TopicItem:
      type: object
      required: [name, internal, partition_count, replication_factor, out_of_sync_replicas]
      properties:
        name: { type: string }
        internal: { type: boolean }
        partition_count: { type: integer }
        replication_factor: { type: integer }
        out_of_sync_replicas: { type: integer }
        messages_count: { type: integer, format: int64, nullable: true }
        segment_size: { type: integer, format: int64, nullable: true }
        cleanup_policy: { type: string, nullable: true }
    CreateTopicRequest:
      type: object
      required: [name]
      properties:
        name: { type: string }
        partitions: { type: integer, default: 1 }
        replication_factor: { type: integer, default: 1 }
        cleanup_policy: { type: string, enum: [delete, compact, "compact,delete"] }
        min_insync_replicas: { type: integer }
        retention_ms: { type: integer, format: int64 }
        retention_bytes: { type: integer, format: int64 }
        max_message_bytes: { type: integer, format: int64 }
        custom_params:
          type: array
          items:
            type: object
            required: [name, value]
            properties:
              name: { type: string }
              value: { type: string }
    PagedTopicsResponse:
      type: object
      required: [items, total, page, page_size, timestamp]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/TopicItem"
        total: { type: integer, minimum: 0 }
        page: { type: integer, minimum: 1 }
        page_size: { type: integer, minimum: 1, maximum: 200 }
        timestamp: { type: string, format: date-time }
    TopicMessageItem:
      type: object
      required: [payload]
      properties:
        partition: { type: integer, nullable: true }
        offset: { type: integer, format: int64, nullable: true }
        timestamp: { type: string, nullable: true }
        key: { type: string, nullable: true }
        payload: { type: string }
    TopicMessagesResponse:
      type: object
      required: [topic, items, total, limit, offset, mode, timestamp]
      properties:
        topic: { type: string }
        items:
          type: array
          items:
            $ref: "#/components/schemas/TopicMessageItem"
        total: { type: integer, minimum: 0 }
        limit: { type: integer, minimum: 1, maximum: 200 }
        offset: { type: string }
        mode: { type: string, enum: [latest, earliest] }
        timestamp: { type: string, format: date-time }
    TopicPartitionMetadata:
      type: object
      required: [partition, replicas]
      properties:
        partition: { type: integer }
        leader: { type: integer, nullable: true }
        replicas:
          type: array
          items: { type: integer }
        high_watermark: { type: integer, format: int64, nullable: true }
    TopicMetadataResponse:
      type: object
      required: [topic, partition_count, partitions, configs, raw, timestamp]
      properties:
        topic: { type: string }
        partition_count: { type: integer, minimum: 0 }
        partitions:
          type: array
          items:
            $ref: "#/components/schemas/TopicPartitionMetadata"
        configs:
          type: object
          additionalProperties:
            type: string
        raw:
          type: array
          items: { type: string }
        timestamp: { type: string, format: date-time }
    ConsumerGroupItem:
      type: object
      required: [group]
      properties:
        group: { type: string }
        state: { type: string, nullable: true }
        members: { type: integer, nullable: true }
        coordinator: { type: string, nullable: true }
        total_lag: { type: integer, format: int64, nullable: true }
    AclUpsertRequest:
      type: object
      required: [principal, resource_type, resource_name, operation, permission]
      properties:
        principal: { type: string }
        host: { type: string, default: "*" }
        resource_type: { type: string, enum: [topic, group, cluster, transactional_id] }
        resource_name: { type: string }
        pattern_type: { type: string, enum: [literal, prefixed], default: literal }
        operation: { type: string }
        permission: { type: string, enum: [allow, deny] }
    SchemaCreateRequest:
      type: object
      required: [subject, schema]
      properties:
        subject: { type: string }
        schema: { type: string }
        schema_type: { type: string, enum: [avro, json, protobuf], default: avro }
        compatibility: { type: string }
    PagedGroupsResponse:
      type: object
      required: [items, total, page, page_size, timestamp]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ConsumerGroupItem"
        total: { type: integer, minimum: 0 }
        page: { type: integer, minimum: 1 }
        page_size: { type: integer, minimum: 1, maximum: 200 }
        timestamp: { type: string, format: date-time }
    GroupLagItem:
      type: object
      required: [topic, partition, current_offset, log_end_offset, lag]
      properties:
        topic: { type: string }
        partition: { type: integer }
        current_offset: { type: integer, format: int64 }
        log_end_offset: { type: integer, format: int64 }
        lag: { type: integer, format: int64 }
    GroupLagResponse:
      type: object
      required: [group, total_lag, entries, timestamp]
      properties:
        group: { type: string }
        total_lag: { type: integer, format: int64 }
        entries:
          type: array
          items:
            $ref: "#/components/schemas/GroupLagItem"
        timestamp: { type: string, format: date-time }
    SourceConfig:
      type: object
      required: [source_type, connection, schema_mode, schemas, tables]
      properties:
        source_type:
          type: string
          enum: [postgres, mysql, mariadb, sqlserver, oracle]
        connection:
          type: object
          additionalProperties:
            type: string
        schema_mode:
          type: string
          enum: [all_schemas, specific_schemas]
        table_mode:
          type: string
          enum: [all_tables, specific_tables]
          default: all_tables
        schemas:
          type: array
          items: { type: string }
        tables:
          type: array
          items: { type: string }
        capture_mode:
          type: string
          enum: [logical, trigger, sync_once, incremental]
          default: logical
          description: "logical = ongoing WAL CDC; trigger = table triggers when WAL is unavailable; sync_once = copy current rows once then stop; incremental = JDBC poll on a timestamp/id watermark (no WAL, no triggers; hard deletes are not captured)"
        changelog_retention_hours:
          type: integer
          minimum: 0
          description: "Trigger capture only. Prune source changelog rows older than this many hours. Omit or 0 disables pruning. Choose a window larger than expected replication lag so unconsumed rows are not dropped."
        timestamp_column:
          type: string
          description: "Incremental capture. Timestamp/watermark column such as updated_at. Combined with incrementing_column this uses JDBC timestamp+incrementing mode."
        incrementing_column:
          type: string
          description: "Incremental capture. Strictly incrementing column, usually the primary key (e.g. id). Required for replica upsert. Append-only tables can use this without a timestamp column."
    TargetConfig:
      type: object
      required: [target_type, connection]
      properties:
        name:
          type: string
          description: User-defined name for this destination
        target_type:
          type: string
          enum: [postgres, mysql, mariadb, sqlserver, oracle]
        connection:
          type: object
          additionalProperties:
            type: string
    LakeDestination:
      type: object
      required: [table_format, zone, change_mode, catalog_type, connection]
      properties:
        name: { type: string }
        table_format:
          type: string
          enum: [iceberg, parquet, delta]
          default: iceberg
        zone:
          type: string
          enum: [bronze, silver, gold]
          default: bronze
          description: CDC lands bronze or silver. Gold is derived, not captured.
        change_mode:
          type: string
          enum: [changelog, upsert, scd2]
          default: changelog
        catalog_type:
          type: string
          enum: [jdbc, rest, hadoop, glue, nessie]
          default: jdbc
        namespace: { type: string }
        warehouse:
          type: string
          description: Warehouse URI such as s3://lake/warehouse
        connection:
          type: object
          additionalProperties:
            type: string
          description: S3-compatible endpoint, bucket, keys, and catalog_uri
    GovernanceConfig:
      type: object
      properties:
        domain:
          type: string
          description: Industry-agnostic bounded context (commerce, clinical, grid)
        dataset: { type: string }
        sensitivity:
          type: string
          enum: [public, internal, confidential, restricted]
          default: internal
        industry_pack:
          type: string
          nullable: true
          description: Optional overlay (retail, banking, healthcare, …)
        pii_fields:
          type: array
          items: { type: string }
    ColumnMapping:
      type: object
      required: [source, target]
      properties:
        source: { type: string }
        target: { type: string }
        data_type:
          type: string
          description: Shared SQL type; source and target column types must match
    TableMapping:
      type: object
      required: [source_schema, source_table, target_schema, target_table]
      properties:
        source_schema: { type: string }
        source_table: { type: string }
        target_schema: { type: string }
        target_table: { type: string }
        identical:
          type: boolean
          default: false
          description: When true, source and target table/column names match and no remap is applied
        columns:
          type: array
          items:
            $ref: "#/components/schemas/ColumnMapping"
    ProfileUpsertRequest:
      type: object
      required: [name, source, flow]
      properties:
        name: { type: string, minLength: 1 }
        description: { type: string }
        pattern:
          type: string
          enum: [source_to_stream, source_to_target, source_to_lake, source_to_olake]
          description: >-
            source_to_target is database replica (current product).
            source_to_stream is Event-first (Kafka topics).
            source_to_lake is Event-first plus Iceberg from Kafka.
            source_to_olake is Analytics-first (OLake; draft only until Phase 3).
        stream_platform:
          type: string
          enum: [kafka, redpanda]
          nullable: true
        transform_strategy:
          type: string
          enum: [none, predefined, custom]
        source:
          $ref: "#/components/schemas/SourceConfig"
        target:
          type: object
          allOf:
            - $ref: "#/components/schemas/TargetConfig"
          nullable: true
        lake:
          type: object
          allOf:
            - $ref: "#/components/schemas/LakeDestination"
          nullable: true
        governance:
          $ref: "#/components/schemas/GovernanceConfig"
        sink_error_policy:
          type: string
          enum: [fail_fast, dlq]
          default: fail_fast
          description: >-
            Source-to-target sink record handling. fail_fast stops logical and
            incremental sinks on rejected records. dlq continues and writes
            rejected records with error-context headers. Trigger sinks retain
            their existing DLQ behavior for backward compatibility.
        flow:
          type: object
          required: [transforms, schedule]
          properties:
            transforms:
              type: array
              items:
                type: object
                additionalProperties: true
            schedule:
              type: object
              required: [delivery_mode]
              properties:
                delivery_mode:
                  type: string
                  enum: [realtime, micro_batch]
                interval_seconds:
                  type: integer
                  minimum: 1
                  nullable: true
            mappings:
              type: array
              items:
                $ref: "#/components/schemas/TableMapping"
    ProfileResponse:
      type: object
      required: [profile, timestamp]
      properties:
        profile:
          type: object
          additionalProperties: true
        timestamp: { type: string, format: date-time }
    ProfilesResponse:
      type: object
      required: [profiles, timestamp]
      properties:
        profiles:
          type: array
          items:
            type: object
            additionalProperties: true
        timestamp: { type: string, format: date-time }
    ProfileDlqStatus:
      type: object
      required:
        [profile_id, configured_policy, effective_policy, enabled, exists, messages_count, high_watermark, timestamp]
      properties:
        profile_id: { type: string, format: uuid }
        configured_policy:
          type: string
          enum: [fail_fast, dlq]
        effective_policy:
          type: string
          enum: [fail_fast, dlq]
        enabled: { type: boolean }
        topic: { type: string, nullable: true }
        exists: { type: boolean }
        messages_count: { type: integer, format: int64 }
        high_watermark: { type: integer, format: int64 }
        size_bytes: { type: integer, format: int64, nullable: true }
        timestamp: { type: string, format: date-time }
    ValidationResponse:
      type: object
      required: [valid, message, timestamp]
      properties:
        valid: { type: boolean }
        message: { type: string }
        timestamp: { type: string, format: date-time }
    SourceCatalogResponse:
      type: object
      required: [reachable, message, schemas, tables, timestamp]
      properties:
        reachable: { type: boolean }
        message: { type: string }
        schemas:
          type: array
          items:
            type: object
            required: [name, table_count, captured]
            properties:
              name: { type: string }
              table_count: { type: integer }
              captured: { type: boolean }
        tables:
          type: array
          items:
            type: object
            required: [schema, name, captured]
            properties:
              schema: { type: string }
              name: { type: string }
              captured: { type: boolean }
              row_count: { type: integer, nullable: true }
              primary_key:
                type: array
                items: { type: string }
        timestamp: { type: string, format: date-time }
    SourceTableInspectRequest:
      type: object
      required: [source, schema, name]
      properties:
        source:
          $ref: "#/components/schemas/SourceConfig"
        schema: { type: string }
        name: { type: string }
        limit: { type: integer, minimum: 1, maximum: 100, default: 50 }
    TriggerInstallRequest:
      type: object
      required: [source]
      properties:
        source:
          $ref: "#/components/schemas/SourceConfig"
        tables:
          type: array
          items: { type: string }
          description: Qualified schema.table names. Defaults to source.tables.
    TriggerInstallResponse:
      type: object
      required: [installed, already_present, change_log, message, timestamp]
      properties:
        installed:
          type: array
          items: { type: string }
        already_present:
          type: array
          items: { type: string }
        change_log: { type: string }
        sql: { type: string }
        executed: { type: boolean }
        message: { type: string }
        timestamp: { type: string, format: date-time }
    TriggerPreviewResponse:
      type: object
      required: [tables, change_log, sql, will_execute, vendor, message, timestamp]
      properties:
        tables:
          type: array
          items: { type: string }
        change_log: { type: string }
        sql: { type: string }
        will_execute: { type: boolean }
        vendor: { type: string }
        message: { type: string }
        timestamp: { type: string, format: date-time }
    TriggerStatusResponse:
      type: object
      required: [change_log_present, tables, timestamp]
      properties:
        change_log_present: { type: boolean }
        tables:
          type: array
          items:
            type: object
            required: [schema, name, installed]
            properties:
              schema: { type: string }
              name: { type: string }
              installed: { type: boolean }
        timestamp: { type: string, format: date-time }
    TargetTableInspectRequest:
      type: object
      required: [target, schema, name]
      properties:
        target:
          $ref: "#/components/schemas/TargetConfig"
        schema: { type: string }
        name: { type: string }
        limit: { type: integer, minimum: 1, maximum: 100, default: 50 }
    SourceTableInspectResponse:
      type: object
      required: [schema, name, primary_key, columns, rows, limit, timestamp]
      properties:
        schema: { type: string }
        name: { type: string }
        row_count: { type: integer, nullable: true }
        primary_key:
          type: array
          items: { type: string }
        columns:
          type: array
          items:
            type: object
            required: [name, data_type, nullable, position, primary_key, unique]
            properties:
              name: { type: string }
              data_type: { type: string }
              nullable: { type: boolean }
              position: { type: integer }
              primary_key: { type: boolean }
              pk_position: { type: integer, nullable: true }
              unique: { type: boolean }
        rows:
          type: array
          items:
            type: object
            additionalProperties: true
        limit: { type: integer }
        timestamp: { type: string, format: date-time }
    ProcessingValidationResponse:
      type: object
      required: [valid, errors]
      properties:
        valid: { type: boolean }
        errors:
          type: array
          items: { type: string }
    ProcessingBatchPolicy:
      type: object
      required: [max_records, max_bytes, max_wait_ms]
      properties:
        max_records: { type: integer, minimum: 1, maximum: 10000, default: 500 }
        max_bytes:
          type: integer
          minimum: 1
          maximum: 67108864
          default: 4194304
        max_wait_ms: { type: integer, minimum: 1, default: 25 }
    ProcessingRetryPolicy:
      type: object
      required: [max_attempts, initial_backoff_ms, max_backoff_ms]
      properties:
        max_attempts: { type: integer, minimum: 1, default: 3 }
        initial_backoff_ms: { type: integer, minimum: 1, default: 100 }
        max_backoff_ms: { type: integer, minimum: 1, default: 5000 }
    DataServiceEnrichment:
      type: object
      required:
        - base_url
        - datasource
        - mapper
        - api_key_env
        - lookup_field
        - lookup_parameter
        - result_key_field
      properties:
        base_url: { type: string, format: uri }
        datasource: { type: string }
        mapper: { type: string }
        api_key_env: { type: string }
        lookup_field: { type: string }
        lookup_parameter: { type: string, default: list }
        result_key_field: { type: string }
        output_field: { type: string, nullable: true }
        static_parameters:
          type: object
          additionalProperties: true
    ProcessingStage:
      type: object
      required:
        - id
        - name
        - kind
        - execution
        - timeout_ms
        - retry
        - failure_policy
        - enabled
      properties:
        id: { type: string, minLength: 1 }
        name: { type: string, minLength: 1 }
        kind:
          type: string
          enum: [transform, filter, enrich]
        execution:
          type: string
          enum: [grpc]
        endpoint: { type: string, format: uri, nullable: true }
        dataservice:
          type: object
          allOf:
            - $ref: "#/components/schemas/DataServiceEnrichment"
          nullable: true
        timeout_ms: { type: integer, minimum: 1, default: 10000 }
        retry:
          $ref: "#/components/schemas/ProcessingRetryPolicy"
        failure_policy:
          type: string
          enum: [fail_pipeline, emit_unchanged, drop, dead_letter]
        enabled: { type: boolean, default: true }
        attributes:
          type: object
          additionalProperties:
            type: string
    ProcessingPipeline:
      type: object
      required:
        - id
        - name
        - input_topic
        - output_topic
        - dead_letter_topic
        - consumer_group
        - batch
        - stages
        - preserve_partition_order
        - enabled
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1 }
        input_topic: { type: string, minLength: 1 }
        output_topic: { type: string, minLength: 1 }
        dead_letter_topic: { type: string, minLength: 1 }
        consumer_group: { type: string, minLength: 1 }
        batch:
          $ref: "#/components/schemas/ProcessingBatchPolicy"
        stages:
          type: array
          items:
            $ref: "#/components/schemas/ProcessingStage"
        preserve_partition_order: { type: boolean, default: true }
        enabled: { type: boolean, default: false }
    AlertRule:
      type: object
      required: [id, name, conditionType, connectorFilter, channels, enabled]
      properties:
        id: { type: string }
        name: { type: string }
        conditionType: { type: string }
        conditionValue:
          type: object
          additionalProperties: true
          nullable: true
        connectorFilter: { type: string }
        channels:
          type: array
          items: { type: string }
        webhookUrl: { type: string, format: uri, nullable: true }
        webhookSecret: { type: string, nullable: true, writeOnly: true }
        enabled: { type: boolean }
        createdAt: { type: string, format: date-time, nullable: true }
