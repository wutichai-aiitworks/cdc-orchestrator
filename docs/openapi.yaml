      summary: Current latency of every sampled pipeline (ADR 0016)
      operationId: listPipelineLatency
      tags: [Pipelines]
      responses:
        "200":
          description: Latest sample per pipeline
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/PipelineLatencyCurrent" }
                  timestamp: { type: string, format: date-time }
  /cdc/profiles/{id}/latency:
    get:
      summary: Latency history of one pipeline
      description: Raw 15 s samples while in memory (up to 6 h), 5-minute rollups otherwise (30 days).
      operationId: getPipelineLatency
      tags: [Pipelines]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
        - { in: query, name: range, schema: { type: string, enum: ["1h", "6h", "24h", "7d", "30d"], default: "1h" } }
      responses:
        "200":
          description: Current value, probe state and points
          content:
            application/json:
              schema:
                type: object
                properties:
                  profileId: { type: string, format: uuid }
                  name: { type: string }
                  range: { type: string }
                  resolution: { type: string, enum: [sample, 5m] }
                  current: { allOf: [{ $ref: "#/components/schemas/PipelineLatencyCurrent" }], nullable: true }
                  probe:
                    type: object
                    properties:
                      enabled: { type: boolean }
                      intervalSecs: { type: integer }
                      unsupportedReason: { type: string, nullable: true }
                  points:
                    type: array
                    items:
                      type: object
                      properties:
                        t: { type: string, format: date-time }
                        e2e_ms: { type: integer, nullable: true, description: "sample value, or rollup p50" }
                        e2e_p95_ms: { type: integer, nullable: true, description: rollup points only }
                        capture_ms: { type: integer, nullable: true }
                        sink_ms: { type: integer, nullable: true }
                        lag_records: { type: integer, nullable: true }
                        throughput_rps: { type: number, nullable: true }
        "404":
          description: Pipeline not found
  /cdc/profiles/{id}/latency-probe:
    put:
      summary: Turn the heartbeat latency probe on or off
      description: >-
        On: creates hyper_cdc.hyper_cdc_heartbeat on the source and adds it to the publication
        when the publication lists tables. A running pipeline must be restarted to capture and
        replicate the table (restartRequired). Postgres source (log-based) → Postgres target only.
      operationId: setPipelineLatencyProbe
      tags: [Pipelines]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
                intervalSecs: { type: integer, minimum: 5, maximum: 300, default: 10 }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled: { type: boolean }
                  intervalSecs: { type: integer }
                  restartRequired: { type: boolean }
                  notes: { type: array, items: { type: string } }
        "400":
          description: Unsupported source/target, or missing privileges on the source
