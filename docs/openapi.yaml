      parameters: [{ $ref: "#/components/parameters/MigrationTool" }]
      responses:
        "200": { description: Contract, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
  /cdc/{tool}/discover:
    get:
      summary: Tool discovery
      operationId: discoverTool
      tags: [Migration Tools]
      parameters: [{ $ref: "#/components/parameters/MigrationTool" }]
      responses:
        "200": { description: Discovery, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
  /cdc/{tool}/validate:
    post:
      summary: Validate a tool profile without saving (pgcopy, redisshake, mongocopy, pgdump, rsync)
      operationId: validateToolProfile
      tags: [Migration Tools]
      parameters: [{ $ref: "#/components/parameters/MigrationTool" }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
      responses:
        "200": { description: Validation result, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
  /cdc/{tool}/test-connection:
    post:
      summary: Test a connection from the tool's sidecar
      description: |
        Connects from the sidecar container (where the tool runs), so it proves the same network
        path and login a run will use. pgcopy: PostgreSQL (warns when the image's pg_dump is older
        than the server); pgloader: PostgreSQL target, MySQL/SQL Server source (pgloader --dry-run),
        SQLite/CSV files inside the container; mongocopy: mongosh ping/version; redisshake: AUTH,
        PING and INFO (warns when the Cluster switch does not match). A failed connection is a
        normal answer `{ok: false, target, error, hint}`; success is `{ok: true, target, facts[],
        warning?}`. `********` is replaced by the saved password from `profile_id` (`side`) only
        when engine, host, port and username are unchanged; otherwise 400.
      operationId: testToolConnection
      tags: [Migration Tools]
      parameters: [{ $ref: "#/components/parameters/MigrationTool" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [connection]
              properties:
                connection: { type: object, additionalProperties: true, description: "type, host, port, database (or file path), username, password" }
                side: { type: string, enum: [source, target], default: source }
                profile_id: { type: string, format: uuid }
                options: { type: object, additionalProperties: true, description: "TLS/cluster switches, auth database, CSV separator, sslmode" }
      responses:
        "200": { description: Test result, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
  /cdc/{tool}/profiles:
    parameters: [{ $ref: "#/components/parameters/MigrationTool" }]
    get:
      summary: List saved tool profiles
      operationId: listToolProfiles
      tags: [Migration Tools]
      responses:
        "200":
          description: Profiles
          content:
            application/json:
              schema:
                type: object
                properties:
                  profiles: { type: array, items: { type: object, additionalProperties: true } }
    post:
      summary: Save a tool profile
      operationId: createToolProfile
      tags: [Migration Tools]
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
      responses:
        "200": { description: Created, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
  /cdc/{tool}/profiles/{id}:
    parameters:
      - $ref: "#/components/parameters/MigrationTool"
      - $ref: "#/components/parameters/ProfileId"
    get:
      summary: Get a tool profile
      operationId: getToolProfile
      tags: [Migration Tools]
      responses:
        "200": { description: Profile, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      summary: Replace a tool profile
      operationId: updateToolProfile
      tags: [Migration Tools]
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
      responses:
        "200": { description: Updated, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      summary: Delete a tool profile
      operationId: deleteToolProfile
      tags: [Migration Tools]
      responses:
        "200": { description: Deleted }
        "404": { $ref: "#/components/responses/NotFound" }
  /cdc/{tool}/profiles/{id}/run:
    post:
      summary: Start a job from a saved profile
      description: |
        Every run is a new job with its own id; the job carries `profile_id`, and the profile's
        `last_job_id` points at it. Sidecars keep the newest runs per profile (default 10; Redis 15).
        A profile can have one active run: starting another returns 400 with the sidecar's
        "already running" message.
      operationId: runToolProfile
      tags: [Migration Tools]
      parameters:
        - $ref: "#/components/parameters/MigrationTool"
        - $ref: "#/components/parameters/ProfileId"
      responses:
        "200": { description: Job started, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
        "404": { $ref: "#/components/responses/NotFound" }
  /cdc/{tool}/jobs:
    get:
      summary: List jobs
      operationId: listToolJobs
      tags: [Migration Tools]
      parameters: [{ $ref: "#/components/parameters/MigrationTool" }]
      responses:
        "200": { description: Jobs, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
  /cdc/{tool}/jobs/{job_id}:
    get:
      summary: Get one job
      operationId: getToolJob
      tags: [Migration Tools]
      parameters: [{ $ref: "#/components/parameters/MigrationTool" }, { $ref: "#/components/parameters/JobId" }]
      responses:
        "200": { description: Job, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
        "404": { $ref: "#/components/responses/NotFound" }
  /cdc/{tool}/jobs/{job_id}/logs:
    get:
      summary: Job log output
      operationId: getToolJobLogs
      tags: [Migration Tools]
      parameters: [{ $ref: "#/components/parameters/MigrationTool" }, { $ref: "#/components/parameters/JobId" }]
      responses:
        "200": { description: Logs, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
        "404": { $ref: "#/components/responses/NotFound" }
  /cdc/{tool}/jobs/{job_id}/stop:
    post:
      summary: Stop a running job
      operationId: stopToolJob
      tags: [Migration Tools]
      parameters: [{ $ref: "#/components/parameters/MigrationTool" }, { $ref: "#/components/parameters/JobId" }]
      responses:
        "200": { description: Stopped, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
        "404": { $ref: "#/components/responses/NotFound" }
  /cdc/pgdump/jobs/{job_id}:
    get:
      summary: Get one pgdump job
      description: |
        Status is starting | running | succeeded | completed_with_errors | failed | stopped.
        Carries artifact {name, format, bytes, sha256, local_deleted}, tables_dumped / tables_restored,
        uploads[] (one per SFTP destination: status pending|uploading|uploaded|failed|stopped,
        bytes_sent, remote_path, host_key_fingerprint, host_key_verified, error, hint), and on failure
        error, first_error and an operator hint. download_path is set while the local file exists.
        A failed upload makes the job completed_with_errors and keeps the local file.
      operationId: getPgDumpJob
      tags: [Migration Tools]
      parameters: [{ $ref: "#/components/parameters/JobId" }]
      responses:
        "200": { description: Job, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      summary: Delete a finished pgdump job and its dump file
      operationId: deletePgDumpJob
      tags: [Migration Tools]
      parameters: [{ $ref: "#/components/parameters/JobId" }]
      responses:
        "200": { description: Deleted, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
  /cdc/pgdump/jobs/{job_id}/file:
    get:
      summary: Download the pgdump artifact (streamed)
      description: |
        Streams the dump file from the cdc-pgdump sidecar. Headers Content-Disposition and
        X-Dump-Sha256. 400 while the job is running (sidecar 409) or when no file exists (sidecar 410),
        including after the local copy was removed because every SFTP destination has it.
      operationId: downloadPgDumpFile
      tags: [Migration Tools]
      parameters: [{ $ref: "#/components/parameters/JobId" }]
      responses:
        "200":
          description: Dump file
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
  /cdc/pgdump/test-connection:
    post:
      summary: Test a Postgres connection from the pgdump sidecar and describe the database
      description: |
        Connects from the cdc-pgdump container (where pg_dump runs), so it proves the same network
        path and credentials a dump will use. A failed connection is a normal answer:
        `{ok: false, target, error, hint}`. On success: `{ok: true, target, latency_ms, server_version,
        server_major, client_version, client_major, compatible, current_user, database_bytes, ssl,
        schemas: [{name, tables, bytes}]}`; `compatible` is false (with a hint) when the server is
        newer than pg_dump. A password of `********` is replaced by the saved one from `profile_id`
        (`side` source|target) only when host, port and username are unchanged; otherwise 400.
      operationId: testPgDumpConnection
      tags: [Migration Tools]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [connection]
              properties:
                connection: { type: object, additionalProperties: true, description: "type, host, port, database, username, password" }
                sslmode: { type: string, enum: [disable, allow, prefer, require, verify-ca, verify-full] }
                profile_id: { type: string, format: uuid }
                side: { type: string, enum: [source, target], default: source }
      responses:
        "200": { description: Test result, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
  /cdc/rsync/test-connection:
    post:
      summary: Log in to an SSH host from the rsync sidecar and describe it
      description: |
        Logs in from the cdc-rsync container (where relay runs and where direct runs start) and
        probes the host: `{ok, target, side, os, arch, rsync_path, rsync_version, gnu_rsync,
        path_kind (dir|file|missing), free_bytes, writable, ssh_client, latency_ms,
        host_key_fingerprint, host_key_verified, warning?}`. rsync is auto-detected, Homebrew
        first (macOS ships openrsync, which lacks progress, ACLs and xattrs). A failed login is a
        normal answer: `{ok: false, error, hint}`. Secrets sent as `********` are taken from
        `profile_id` only when host, port and username are unchanged; otherwise 400.
      operationId: testRsyncConnection
      tags: [Migration Tools]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [endpoint]
              properties:
                endpoint: { type: object, additionalProperties: true, description: "host, port, username, auth (key|password), password, private_key, passphrase, path, host_key_fingerprint, rsync_path" }
                side: { type: string, enum: [source, target], default: source }
                profile_id: { type: string, format: uuid }
      responses:
        "200": { description: Test result, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
  /cdc/rsync/test-route:
    post:
      summary: Check whether a sync would run direct (source → target) or fall back to relay
      description: |
        Logs in to the source with the target key in a forwarded ssh-agent and, from the source,
        logs in to the target (`reach_host`/`reach_port` when set). Answers `{direct: true,
        transport: direct, target: {os, rsync_path, …}, target_host_key_fingerprint}` or
        `{direct: false, transport: relay, error, hint}`. A password target is never direct.
      operationId: testRsyncRoute
      tags: [Migration Tools]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source, target]
              properties:
                source: { type: object, additionalProperties: true }
                target: { type: object, additionalProperties: true }
                profile_id: { type: string, format: uuid }
      responses:
        "200": { description: Route check, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
  /cdc/rsync/profiles/{id}/run:
    post:
      summary: Run (or preview) an rsync profile
      description: |
        Starts a sidecar job. With `dry_run=true` the run is a preview (`--dry-run
        --itemize-changes`): nothing is written on the target and the job carries
        `changes: {counts: {create, update, delete, attrs}, items: [{op, kind, path}] (first 500),
        truncated}`. In relay mode a preview still refreshes the relay copy (pull), then dry-runs the push.
      operationId: runRsyncProfile
      tags: [Migration Tools]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
        - { in: query, name: dry_run, required: false, schema: { type: boolean } }
      responses:
        "200": { description: Job started, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
  /cdc/rsync/jobs/{job_id}:
    get:
      summary: Get one rsync job
      description: |
        Status is starting | running | succeeded | completed_with_errors | failed | stopped.
        `phase` connect|route|sync|pull|push; `transport` direct|relay with `transport_reason`
        (why auto fell back); `progress {bytes, percent, rate, eta, files_transferred,
        files_to_check, files_total}` while running; `stats` (rsync --stats, snake_case keys, of the
        sync or push) and `stats_pull` (relay); `hosts.{source,target}` facts; `host_keys` with
        fingerprints and whether they were pinned; `changes` for previews; on failure `error`,
        `first_error` and an operator `hint`. rsync exits 23/24/25 (partial, vanished, max_delete)
        are completed_with_errors.
      operationId: getRsyncJob
      tags: [Migration Tools]
      parameters: [{ $ref: "#/components/parameters/JobId" }]
      responses:
        "200": { description: Job, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      summary: Delete a finished rsync job record
      operationId: deleteRsyncJob
      tags: [Migration Tools]
      parameters: [{ $ref: "#/components/parameters/JobId" }]
      responses:
        "200": { description: Deleted, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
  /cdc/rsync/staging:
    get:
      summary: Relay staging copies on the rsync sidecar
      description: "One per profile (`id` = profile id), kept so relay runs stay incremental. Answer: `{staging: [{id, bytes, modified_at}], free_mb}`."
      operationId: listRsyncStaging
      tags: [Migration Tools]
      responses:
        "200": { description: Staging copies, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
  /cdc/rsync/staging/{id}:
    delete:
      summary: Free a profile's relay staging copy
      description: "The next relay run of that profile pulls everything again. 400 while the profile is running. Deleting a profile also removes its staging copy."
      operationId: deleteRsyncStaging
      tags: [Migration Tools]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        "200": { description: Deleted, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
  /cdc/connectors/plugins:
    get:
      summary: List connector plugins installed on the Kafka Connect worker
      operationId: listConnectorPlugins
      tags: [Connectors]
      responses:
        "200": { description: Installed plugins, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
  /cdc/connectors/{name}/topics:
    get:
      summary: Topics a connector has produced to or consumed from
      operationId: getConnectorTopics
      tags: [Connectors, Kafka]
      parameters:
        - { in: path, name: name, required: true, schema: { type: string } }
      responses:
        "200": { description: Connector topics, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
        "404": { $ref: "#/components/responses/NotFound" }
  /cdc/consumer-groups/{group}/lag:
    get:
      summary: Consumer group lag per partition (alias of /cdc/kafka/groups/{group}/lag)
      operationId: getConsumerGroupLag
      tags: [Kafka]
      parameters:
        - { in: path, name: group, required: true, schema: { type: string } }
      responses:
        "200":
          description: Group lag
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GroupLagResponse" }
  /cdc/consumer-groups/{group}/topics/{topic}/offsets:
    delete:
      summary: Delete a consumer group's committed offsets for one topic
      operationId: deleteConsumerGroupTopicOffsets
      tags: [Kafka]
      parameters:
        - { in: path, name: group, required: true, schema: { type: string } }
        - { in: path, name: topic, required: true, schema: { type: string } }
      responses:
        "200": { description: Offsets deleted, content: { application/json: { schema: { $ref: "#/components/schemas/ActionResponse" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
  /cdc/schemas/{subject}/compatibility:
    parameters:
      - { in: path, name: subject, required: true, schema: { type: string } }
    post:
      summary: Test a candidate schema against the subject's compatibility rule
      operationId: checkSchemaCompatibility
      tags: [Kafka]
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
      responses:
        "200": { description: Compatibility result, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
    put:
      summary: Set the subject's compatibility level
      operationId: setSchemaCompatibility
      tags: [Kafka]
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
      responses:
        "200": { description: Compatibility updated, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
  /cdc/schemas/{subject}/versions/{version}:
    delete:
      summary: Delete one schema version from a subject
      operationId: deleteSchemaVersion
      tags: [Kafka]
      parameters:
        - { in: path, name: subject, required: true, schema: { type: string } }
        - { in: path, name: version, required: true, schema: { type: string } }
      responses:
        "200": { description: Version deleted, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
        "404": { $ref: "#/components/responses/NotFound" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  responses:
    Unauthorized:
      description: Missing or invalid bearer token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    BadRequest:
      description: Invalid request or processing configuration
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Requested resource was not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  parameters:
    ProfileId:
      in: path
      name: id
      required: true
      schema: { type: string, format: uuid }
    JobId:
      in: path
      name: job_id
      required: true
      schema: { type: string }
    MigrationTool:
      in: path
      name: tool
      required: true
      schema: { type: string, enum: [pgcopy, pgloader, redisshake, mongocopy, pgdump, rsync] }
    AuditLimit:
      in: query
      name: limit
      schema: { type: integer, minimum: 1 }
  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
    HealthResponse:
      type: object
      required: [service, status, enabled, timestamp]
      properties:
        service: { type: string, example: hyper-cdc-orchestrator }
        status: { type: string, example: ok }
        enabled: { type: boolean }
        timestamp: { type: string, format: date-time }
    CapabilityResponse:
      type: object
      required: [service, version, api_prefix, features, timestamp]
      properties:
        service: { type: string }
        version: { type: string, example: 0.2.0 }
        api_prefix: { type: string, example: /cdc }
        features:
          type: object
          additionalProperties:
            type: boolean
        timestamp: { type: string, format: date-time }
    ServiceStatus:
      type: object
      required: [name, state]
      properties:
        name: { type: string }
        state: { type: string }
        health: { type: string, nullable: true }
    EngineStatusResponse:
      type: object
      required: [engine_target, services, timestamp]
      properties:
        engine_target: { type: string }
        services:
          type: array
          items:
            $ref: "#/components/schemas/ServiceStatus"
        timestamp: { type: string, format: date-time }
    ActionResponse:
      type: object
      required: [action, status, message, audit_id, timestamp]
      properties:
        action: { type: string, example: connect.restart }
        status: { type: string, example: success }
        message: { type: string }
        audit_id: { type: string }
        timestamp: { type: string, format: date-time }
    ConnectorCreateRequest:
      type: object
      required: [name, config]
      properties:
        name: { type: string, minLength: 1 }
        config:
          type: object
          additionalProperties:
            type: string
    ConnectorUpdateRequest:
      type: object
      required: [config]
      properties:
        config:
          type: object
          additionalProperties:
            type: string
    ConnectorValidateRequest:
      type: object
      required: [config]
      properties:
        name: { type: string, nullable: true }
        config:
          type: object
          additionalProperties:
            type: string
    ConnectorValidationIssue:
      type: object
      required: [field, message]
      properties:
        field: { type: string }
        message: { type: string }
    ConnectorValidateResponse:
      type: object
      required: [valid, errors, warnings, timestamp]
      properties:
        valid: { type: boolean }
        normalized_name: { type: string, nullable: true }
        errors:
          type: array
          items:
            $ref: "#/components/schemas/ConnectorValidationIssue"
        warnings:
          type: array
          items: { type: string }
        upstream:
          type: object
          additionalProperties: true
          nullable: true
        timestamp: { type: string, format: date-time }
    ConnectorsResponse:
      type: object
      required: [connectors, timestamp]
      properties:
        connectors:
          type: object
          additionalProperties: true
        timestamp: { type: string, format: date-time }
    ConnectorStatusResponse:
      type: object
      required: [name, status, timestamp]
      properties:
        name: { type: string }
        status:
          type: object
          additionalProperties: true
        timestamp: { type: string, format: date-time }
    ConnectorTemplate:
      type: object
      required: [id, name, description, kind, database_type, config]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        kind: { type: string, enum: [source, sink] }
        database_type: { type: string }
        config:
          type: object
          additionalProperties:
            type: string
    ConnectorInspectRequest:
      type: object
      properties:
        name: { type: string, nullable: true }
        config:
          type: object
          additionalProperties:
            type: string
        schema: { type: string, nullable: true, description: Optional schema filter for catalog }
    ConnectorConnectionPublic:
      type: object
      required: [host, port, database, username]
      properties:
        host: { type: string }
        port: { type: string }
        database: { type: string }
        username: { type: string }
        jdbc_url: { type: string, nullable: true }
    ConnectorProbeResponse:
      type: object
      required: [valid, reachable, kind, database_type, database_label, class_name, connection, configured_schemas, configured_tables, message, timestamp]
