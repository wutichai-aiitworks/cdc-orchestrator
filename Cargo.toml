[package]
name = "hyper-cdc-orchestrator"
version = "1.1.0"
edition = "2021"
default-run = "hyper-cdc-orchestrator"

[dependencies]
async-stream = "0.3"
axum = { version = "0.7", features = ["macros", "ws"] }
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
globset = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
subtle = "2"
tower-http = { version = "0.6", features = ["trace", "cors", "set-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2"
urlencoding = "2"
uuid = { version = "1", features = ["serde", "v4", "v5"] }
tokio-postgres = { version = "0.7", default-features = false, features = ["runtime"] }
async-trait = "0.1.92"
bytes = "1.12.1"
prost = "0.14.4"
rdkafka = { version = "0.39.0", features = ["cmake-build", "tokio"] }
tokio-util = { version = "0.7.19", features = ["compat"] }
tonic = "0.14.6"
tonic-prost = "0.14.6"
mysql_async = { version = "0.37.0", default-features = false, features = ["default-rustls-ring"] }
tiberius = { version = "0.12.3", default-features = false, features = ["chrono", "rustls", "tds73"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }

# Copy & Sync timeline: run log tails (ANSI strip, URI password mask, error line).
# Also used by tests to assert generated `table.include.list` patterns match real identifiers.
regex = "1"

[dev-dependencies]

[build-dependencies]
protoc-bin-vendored = "3.2.0"
tonic-prost-build = "0.14.6"
