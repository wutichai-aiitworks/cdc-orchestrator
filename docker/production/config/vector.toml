# Production Vector config: Copy & Sync job logs → OpenObserve only.
#
# Differs from docker/config/vector.toml on purpose: the dev config also tails every Kafka
# topic to stdout (`sources.cdc_kafka` → `sinks.console`). In production that would copy
# replicated row data, customer data included, into `docker logs`. Do not add it back here.

[sources.copy_job_logs]
type = "file"
include = [
  "/var/lib/pgcopydb/jobs/*/clone.log",
  "/var/lib/redisshake/jobs/*/sync.log",
  "/var/lib/pgloader/jobs/*/load.log",
  "/var/lib/mongocopy/jobs/*/copy.log",
]
read_from = "beginning"

[transforms.copy_enrich]
type = "remap"
inputs = ["copy_job_logs"]
source = '''
file = to_string(.file) ?? ""
.service = "cdc-copy"
.tool = if contains(file, "pgcopydb") {
  "pgcopy"
} else if contains(file, "redisshake") {
  "redisshake"
} else if contains(file, "pgloader") {
  "pgloader"
} else if contains(file, "mongocopy") {
  "mongocopy"
} else {
  "copy"
}
msg = to_string(.message) ?? ""
# Mask credentials embedded in connection URIs.
.message = replace(msg, r'://[^/\s:]+:[^@/\s]+@', "://***:***@")
'''

[sinks.openobserve]
type = "http"
inputs = ["copy_enrich"]
uri = "${O2_URL}/api/${O2_ORG}/${O2_STREAM}/_json"
method = "post"
auth.strategy = "basic"
auth.user = "${O2_USER}"
auth.password = "${O2_PASSWORD}"
compression = "gzip"
encoding.codec = "json"
healthcheck.enabled = false
